# Code the Future — production site (repo root).
# Set OPENAI_API_KEY (and optionally OPENAI_MODEL / OPENAI_IMAGE_MODEL) and
# STRIPE_SECRET_KEY (for checkout) in:
#   Netlify → Site configuration → Environment variables.
# Keys live only on the server — never shipped to the browser.

[build]
  publish = "."
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

# Canonical host: keep all public equity on the apex domain Google sees in
# canonical tags, Open Graph URLs, robots.txt, and sitemap.xml.
[[redirects]]
  from = "https://www.codethefuture.net/*"
  to = "https://codethefuture.net/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://codethefuture.net/*"
  to = "https://codethefuture.net/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.codethefuture.net/*"
  to = "https://codethefuture.net/:splat"
  status = 301
  force = true

# Collapse Netlify's extensionless HTML aliases into the canonical URLs used in
# metadata and the sitemap.
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 301
  force = true

[[redirects]]
  from = "/faq"
  to = "/faq.html"
  status = 301
  force = true

[[redirects]]
  from = "/older-kids"
  to = "/older-kids.html"
  status = 301
  force = true

[[redirects]]
  from = "/young-teens"
  to = "/young-teens.html"
  status = 301
  force = true

[[redirects]]
  from = "/older-adults"
  to = "/older-adults.html"
  status = 301
  force = true

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 301
  force = true

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/platform/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Front-door gate for the learner platform (sales site at / stays public).
# Active only when AUTH_SIGNING_SECRET is set. Excludes the asset/lib folders the
# public sales page reuses, and the login page itself (the door to /api/auth).
[[edge_functions]]
  path = "/platform/*"
  excludedPath = ["/platform/assets/*", "/platform/lib/*", "/platform/login.html"]
  function = "gate"

[[edge_functions]]
  path = "/curriculum/*"
  function = "gate"

# Student showcase lives at studentdemos.codethefuture.net (a domain alias on
# this site). This host-aware function serves the /studentdemos folder for that
# subdomain behind the cohort password, and bounces the raw /studentdemos/* path
# on the apex to the gated subdomain. No effect on any other host.
[[edge_functions]]
  path = "/*"
  function = "showcase-gate"

# Internal docs live in the repo but must never be served on the live site.
# Block the whole /docs/* tree (handoff notes, competitive research, etc.).
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/api/badai"
