<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="/platform/assets/logo-icon-tile.svg">
<title>Code the Future — Build Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap');
:root{ --display:'Space Grotesk',system-ui,sans-serif; --body:'Plus Jakarta Sans',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --teal:#26C7D1; --blue:#3D74FF; --amber:#FFB320; --coral:#FF5A38; --green:#3FD08A; --purple:#9B7BFF; }
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ font-family:var(--body); color:#EAF1FF; background:
  radial-gradient(120% 90% at 82% -10%, rgba(155,123,255,.22), transparent 55%),
  radial-gradient(120% 90% at 8% 110%, rgba(38,199,209,.22), transparent 55%),
  linear-gradient(165deg,#101a3c,#0A1024 55%,#070C1A); overflow:hidden; }
#stage{ position:fixed; inset:0; display:flex; flex-direction:column; }
.screen{ position:absolute; inset:0; display:flex; flex-direction:column; opacity:0; transform:translateY(12px); transition:opacity .4s, transform .4s; pointer-events:none; }
.screen.on{ opacity:1; transform:none; pointer-events:auto; }
.center{ align-items:center; justify-content:center; padding:max(18px,env(safe-area-inset-top)) 18px 18px; text-align:center; overflow-y:auto; }
.kicker{ font-family:var(--mono); font-size:13px; letter-spacing:.2em; text-transform:uppercase; color:var(--purple); margin:0 0 12px; }
.t-big{ font-family:var(--display); font-weight:700; font-size:clamp(2rem,6vw,3.4rem); line-height:1.06; margin:0; letter-spacing:-.02em; }
.t-big .grad{ background:linear-gradient(110deg,#9fb6ff,#9B7BFF 50%,#26C7D1); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.lede{ max-width:44ch; font-size:1.08rem; opacity:.9; margin:16px auto 4px; line-height:1.5; }
.btn{ font-family:var(--display); font-weight:700; font-size:1.05rem; color:#06122b; border:none; cursor:pointer; padding:14px 28px; border-radius:999px;
  background:linear-gradient(120deg,#9fb6ff,#9B7BFF); box-shadow:0 12px 30px rgba(155,123,255,.5); transition:transform .12s; text-decoration:none; display:inline-block; }
.btn:hover{ transform:translateY(-2px); } .btn:disabled{ opacity:.45; cursor:not-allowed; transform:none; }
.btn.green{ background:linear-gradient(120deg,#9BF5C7,#26C7D1); box-shadow:0 12px 30px rgba(38,199,209,.5); }
.btn.ghost{ background:rgba(255,255,255,.1); color:#fff; box-shadow:none; }
.dreamcard{ max-width:560px; margin:14px auto; background:rgba(255,255,255,.06); border:1px solid rgba(127,227,255,.25); border-radius:20px; padding:22px; }
.chips{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:8px 0 14px; }
.chip{ font-family:var(--display); font-weight:600; font-size:.9rem; color:#cfe3ff; cursor:pointer; background:rgba(127,227,255,.1); border:1.5px solid rgba(127,227,255,.3); border-radius:999px; padding:9px 14px; }
.chip:hover{ background:rgba(127,227,255,.2); }
.ta{ width:100%; min-height:88px; resize:vertical; font-family:var(--body); font-size:1.05rem; color:#fff; background:rgba(255,255,255,.06); border:1.5px solid rgba(127,227,255,.35); border-radius:16px; padding:14px; outline:none; }
.ta:focus{ border-color:#9B7BFF; } .ta::placeholder{ color:rgba(207,227,255,.5); }
#studio{ padding:0; }
.shead{ flex:0 0 auto; display:flex; align-items:center; gap:12px; padding:11px 16px; border-bottom:1px solid rgba(255,255,255,.1); }
.shead .lico{ font-size:1.5rem; }
.shead .st{ font-family:var(--display); font-weight:700; font-size:1.04rem; line-height:1.15; }
.shead .st small{ display:block; font-family:var(--mono); font-weight:500; font-size:.72rem; letter-spacing:.06em; color:var(--purple); }
.shead .prog{ margin-left:auto; display:flex; align-items:center; gap:8px; }
.shead .bar{ width:120px; height:8px; border-radius:99px; background:rgba(255,255,255,.14); overflow:hidden; }
.shead .bar i{ display:block; height:100%; background:linear-gradient(90deg,#9B7BFF,#26C7D1); transition:width .4s; }
.shead .exit{ font-family:var(--display); font-weight:700; font-size:.85rem; border:none; cursor:pointer; border-radius:999px; padding:8px 14px; background:rgba(255,255,255,.1); color:#fff; }
.guide{ flex:0 0 auto; padding:10px 16px; font-size:.98rem; line-height:1.45; color:#dCEBFF; background:rgba(155,123,255,.1); border-bottom:1px solid rgba(155,123,255,.2); }
.guide b{ color:#fff; }
.preview-wrap{ flex:1 1 auto; position:relative; margin:12px; border-radius:16px; overflow:hidden; background:#fff; box-shadow:0 18px 50px rgba(0,0,0,.5); border:1px solid rgba(127,227,255,.2); min-height:0; }
.preview-wrap iframe{ width:100%; height:100%; border:0; display:block; background:#fff; }
.preview-empty{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:#5F6B82; text-align:center; padding:24px; }
.preview-empty .pe-ic{ font-size:3rem; }
.building{ position:absolute; inset:0; background:rgba(8,12,30,.85); display:none; flex-direction:column; align-items:center; justify-content:center; gap:16px; color:#fff; z-index:3; }
.building.on{ display:flex; }
.building .spin{ width:46px; height:46px; border:5px solid rgba(155,123,255,.3); border-top-color:#9B7BFF; border-radius:50%; animation:sp .9s linear infinite; }
@keyframes sp{ to{ transform:rotate(360deg); } }
.building .bmsg{ font-family:var(--display); font-weight:700; font-size:1.05rem; }
.controls{ flex:0 0 auto; padding:8px 14px max(14px,env(safe-area-inset-bottom)); background:linear-gradient(180deg,transparent,rgba(6,10,22,.6)); }
.qchips{ display:flex; gap:7px; flex-wrap:wrap; justify-content:center; margin-bottom:9px; }
.qchip{ font-family:var(--body); font-weight:600; font-size:.82rem; color:#cfe3ff; cursor:pointer; background:rgba(127,227,255,.1); border:1px solid rgba(127,227,255,.3); border-radius:999px; padding:7px 12px; }
.qchip:hover{ background:rgba(127,227,255,.2); }
.cbar{ display:flex; gap:8px; max-width:820px; margin:0 auto; align-items:center; }
.cbar input{ flex:1; min-width:0; font-family:var(--body); font-size:1rem; color:#fff; background:rgba(255,255,255,.08); border:1.5px solid rgba(127,227,255,.35); border-radius:14px; padding:13px 16px; outline:none; }
.cbar input:focus{ border-color:#9B7BFF; }
.cbar .btn{ padding:12px 18px; font-size:.95rem; flex:0 0 auto; }
.toast{ position:fixed; left:50%; bottom:92px; transform:translateX(-50%); z-index:50; background:rgba(8,14,30,.95); border:1px solid rgba(255,140,110,.5); color:#ffded2; padding:12px 18px; border-radius:14px; font-weight:600; max-width:80vw; text-align:center; opacity:0; transition:opacity .2s; pointer-events:none; }
.toast.on{ opacity:1; }
.confetti{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:40; }
.confetti i{ position:absolute; top:-12px; width:9px; height:14px; border-radius:2px; animation:fall linear forwards; }
@keyframes fall{ to{ transform:translateY(110vh) rotate(540deg); opacity:.9; } }
.pubcard{ max-width:560px; margin:14px auto; background:rgba(255,255,255,.06); border:1px solid rgba(127,227,255,.25); border-radius:20px; padding:24px; }
.pubcard input{ width:100%; font-family:var(--body); font-size:1.05rem; color:#fff; background:rgba(255,255,255,.06); border:1.5px solid rgba(127,227,255,.35); border-radius:14px; padding:13px 16px; outline:none; margin:8px 0 16px; }
</style>
</head>
<body>
<div id="stage">
  <section id="intro" class="screen center on"></section>
  <section id="studio" class="screen"></section>
  <section id="done" class="screen center"></section>
  <section id="publish" class="screen center"></section>
</div>
<div class="toast" id="toast"></div>

<script src="/platform/lib/avatar.js"></script>
<script src="/platform/lib/filter.js"></script>
<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  function el(t,c,h){ var n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function profile(){ try{ return JSON.parse(localStorage.getItem('ctf:profile')||'null')||{}; }catch(e){ return {}; } }
  var name = (profile().display_name||'Builder').toString().slice(0,24);
  function dream(){ try{ return JSON.parse(localStorage.getItem('ctf:buildDream')||'null'); }catch(e){ return null; } }
  function getProject(){ try{ return localStorage.getItem('ctf:m4project')||''; }catch(e){ return ''; } }
  function setProject(h){ try{ localStorage.setItem('ctf:m4project', h); }catch(e){} }
  function getProgress(){ try{ return parseInt(localStorage.getItem('ctf:m4progress')||'0',10)||0; }catch(e){ return 0; } }
  function setProgress(n){ try{ localStorage.setItem('ctf:m4progress', String(Math.max(getProgress(), n))); }catch(e){} }

  // The 12 build layers — each checkpoint adds one layer to the SAME project.
  // Generic defaults; the BLUEPRINTS below override guide + chips per project kind.
  var LAYERS = [
    { icon:'📝', title:'The Plan', guide:'This is <b>your</b> project. Tell the AI your dream app or game. We\'ll start simple and add a new layer at every checkpoint across the week.', kickoff:true,
      chips:['a clicker game','a catch game','a virtual pet','a quiz show','an endless runner','a choose-your-adventure story'] },
    { icon:'🖼️', title:'The Canvas', guide:'Give your project a clear home — a big title, a nice background, and a tidy layout to build on.',
      chips:['add a big fun title','give it a colorful background','tidy up the layout'] },
    { icon:'⭐', title:'The Star', guide:'Add the main thing — your character, the hero, or the main button everything happens around.',
      chips:['add a main character','add a big main button','add the hero object'] },
    { icon:'🕹️', title:'Make It Move', guide:'Make it interactive! Let the player click, tap, or move things around.',
      chips:['let me move it with the arrow keys','make it react when I click','add drag and drop'] },
    { icon:'🎯', title:'The Goal', guide:'What\'s the point? Add a goal or a rule — something fun to try to do.',
      chips:['add a goal to reach','add a simple rule','add a way to win'] },
    { icon:'🔢', title:'Keep Score', guide:'Add a score or progress so players can see how they\'re doing.',
      chips:['add a score counter','add a timer','show a progress bar'] },
    { icon:'🔊', title:'Make It React', guide:'Make it feel alive — add sounds, wiggles, or fun reactions when things happen.',
      chips:['add a happy sound effect','make things bounce when clicked','add a celebration effect'] },
    { icon:'🎨', title:'Dress It Up', guide:'Style time! Pick colors and make it look amazing — your taste, your call.',
      chips:['use brighter colors','make it look fancy','add a fun theme'] },
    { icon:'⬆️', title:'Level Up', guide:'Add a challenge — make it harder, add a level, or a surprise twist.',
      chips:['make it harder over time','add a second level','add a surprise twist'] },
    { icon:'🏁', title:'The Welcome', guide:'Add a start screen with your project\'s name and how to play, so anyone can pick it up.',
      chips:['add a start screen with my project\'s name','add how-to-play instructions','add a big Play button'] },
    { icon:'🐛', title:'Bug Hunt', guide:'Test it like a real builder — try everything! Tell the AI anything to fix or clean up.',
      chips:['fix anything that looks broken','make the buttons bigger and easier to tap','clean it all up'] },
    { icon:'🏆', title:'Ship & Show', guide:'You did it! Name your creation and publish it to the internet — ready to show your family at the library.', publish:true, chips:[] }
  ];

  // Per-kind building blocks for checkpoints 2–9 (Canvas → Level Up). {hero}/{world}
  // are filled from the kid's saved dream, so every chip talks about THEIR project.
  var BLUEPRINTS = {
    clicker: [
      { g:'Set the stage for your clicker — a big title and a {world}-style background.', c:['add a big title and a {world} background','put the tap area front and center','tidy the layout'] },
      { g:'Add the star: the thing everyone taps — {hero}, nice and big.', c:['add a giant {hero} in the middle to tap','make {hero} look awesome','show a "+1" when I tap {hero}'] },
      { g:'Make tapping feel great — squish, pop, and count every tap.', c:['make {hero} squish when tapped','make taps feel bouncy and fun','count every single tap'] },
      { g:'Give it a goal — upgrades to buy with your points!', c:['add an upgrade that gives +2 per tap','add an auto-tapper I can buy','add 3 upgrades that cost more each time'] },
      { g:'Show the numbers — points, points-per-tap, best score.', c:['add a big score at the top','show my points-per-tap','save and show my best score'] },
      { g:'Make it celebrate — sounds and effects when milestones hit.', c:['add a pop sound on every tap','confetti when I reach 100 points','make the screen flash at milestones'] },
      { g:'Style it YOUR way — colors and details that match {world}.', c:['make everything match the {world} theme','add fun details in the background','use brighter colors'] },
      { g:'Level it up — bigger goals, golden taps, surprises.', c:['add a rare golden {hero} worth 10 points','add a level-up every 250 points','add a surprise bonus event'] }
    ],
    catch: [
      { g:'Set the scene where things fall — sky above, ground below.', c:['add a big title and the {world} scene','draw the sky and the ground','tidy the layout'] },
      { g:'Add your catcher — {world}, ready at the bottom.', c:['add {world} at the bottom of the screen','make the catcher look great','make the catcher nice and big'] },
      { g:'Make it move! Slide your catcher left and right.', c:['move the catcher with arrow keys','let me drag the catcher with my finger','make the movement smooth'] },
      { g:'Rain it down — {hero} falls, and some bad stuff to dodge.', c:['make {hero} fall from the top','add bad things to avoid','make them fall in random spots'] },
      { g:'Keep score — catches count, misses matter.', c:['+1 for every {hero} I catch','lose a life when I catch a bad thing','add 3 lives with hearts'] },
      { g:'Make catches feel amazing — sounds and effects.', c:['happy sound when I catch {hero}','sad buzz for bad catches','little sparkle when I catch something'] },
      { g:'Dress the whole game in your {world} style.', c:['style everything to match {world}','make the falling things colorful','add background details'] },
      { g:'Speed it up — the longer you last, the wilder it gets.', c:['make things fall faster over time','add a super-rare bonus catch worth 5','show a GAME OVER screen with my score'] }
    ],
    dodge: [
      { g:'Build the world you\'ll fly through — {world}, big title.', c:['add a title and a {world} background','make the background feel like moving','tidy the layout'] },
      { g:'Add your flyer — {hero}, ready to zoom.', c:['add {hero} on the left side','make {hero} look fast and cool','add a little trail behind {hero}'] },
      { g:'Take the controls — steer {hero} around the screen.', c:['move {hero} with the arrow keys','make {hero} follow my finger','make the steering smooth'] },
      { g:'Add the danger — obstacles streaming through {world}.', c:['add obstacles flying at me','make them come in random patterns','crash = game over screen'] },
      { g:'Score the run — how long can you survive?', c:['score goes up the longer I fly','show my best run ever','add stars to grab for bonus points'] },
      { g:'Feel the action — near-misses, booms, and zooms.', c:['add a whoosh when I dodge close','shake the screen on a crash','celebrate every 20 points'] },
      { g:'Style your {world} — make it gorgeous.', c:['make {world} look amazing','give the obstacles a cool style','add moving background layers'] },
      { g:'Push the limits — speed, waves, shields.', c:['make it faster the longer I survive','add a shield power-up','add a boss obstacle every 50 points'] }
    ],
    runner: [
      { g:'Lay the track — {world} scrolling by, title up top.', c:['add a title and the {world} scenery','draw the ground to run on','make the background scroll'] },
      { g:'Add the runner — {hero}, ready at the start line.', c:['add {hero} running on the ground','give {hero} a running animation','make {hero} look determined'] },
      { g:'Jump! Make {hero} leap when you tap or press space.', c:['make {hero} jump when I press space','let me tap to jump','make the jump feel bouncy'] },
      { g:'Add obstacles — things to leap over as {world} rushes past.', c:['add obstacles to jump over','make them come at random times','trip = game over screen'] },
      { g:'Count the run — distance, coins, best ever.', c:['score goes up as I run','add coins to collect','show my best distance'] },
      { g:'Make it feel alive — footsteps, boings, and stumbles.', c:['add a boing sound on jumps','add a coin ding','make the screen shake when I trip'] },
      { g:'Style the world — your {world}, your colors.', c:['make {world} look amazing','add clouds and background details','give {hero} a cool outfit'] },
      { g:'Turn up the heat — speed, double jumps, power-ups.', c:['make it faster over time','add a double jump','add a magnet power-up that pulls coins in'] }
    ],
    memory: [
      { g:'Set the table — a {world} board waiting for cards.', c:['add a title and a {world} background','make space for a grid of cards','tidy the layout'] },
      { g:'Deal the cards — face-down cards all about {hero}.', c:['add 12 face-down cards in a grid','put {hero} pictures or emoji on the card faces','make the card backs look mysterious'] },
      { g:'Make them flip — tap a card to peek at it.', c:['flip a card when I tap it','only let 2 cards flip at a time','make the flip animation smooth'] },
      { g:'The rule: match the pairs! Matches stay, misses flip back.', c:['keep matched pairs face up','flip mismatches back after a second','celebrate when I find a match'] },
      { g:'Track the game — moves, matches, and your best.', c:['count my moves','add a timer','show my best score'] },
      { g:'Make it feel magic — sounds and sparkles on matches.', c:['happy sound on a match','sparkle effect on matched cards','big celebration when I match them all'] },
      { g:'Style the deck — your {world} look on every card.', c:['style the cards to match {world}','make the colors pop','add a fun font for the title'] },
      { g:'Harder rounds — more cards, tricky twists.', c:['add a harder level with 20 cards','add a 60-second challenge mode','shuffle with a cool animation'] }
    ],
    quiz: [
      { g:'Build the stage — {world} needs its glowing set.', c:['add the show title {world} in lights','give it a game-show background','tidy the layout'] },
      { g:'Add the first questions — all about {hero}!', c:['add 5 multiple-choice questions about {hero}','show one question at a time','add 4 answer buttons per question'] },
      { g:'Make answering feel real — pick, lock in, next question.', c:['highlight the answer I pick','show right or wrong after I answer','add a Next Question button'] },
      { g:'The rules of the show — points for right, streaks for glory.', c:['+10 points per right answer','add a streak bonus for right answers in a row','show the final score at the end'] },
      { g:'Show the scoreboard — running score and question count.', c:['show my score during the game','show which question number I\'m on','add a progress bar'] },
      { g:'Bring the show to life — dings, buzzers, applause.', c:['ding for right answers','buzzer for wrong ones','confetti on the final score screen'] },
      { g:'Set-design time — make {world} look like TV.', c:['make it look like a real game show','add spotlights and shine','style the answer buttons'] },
      { g:'The bonus round — timers, harder questions, prizes.', c:['add a 10-second timer per question','add a double-points bonus round','add 5 harder questions'] }
    ],
    pet: [
      { g:'Build the home — {world}, where {hero} lives.', c:['add a title and draw {world}','make a cozy spot for my pet','tidy the layout'] },
      { g:'Bring in your pet — {hero} arrives!', c:['add {hero} in the middle','make {hero} blink and look around','give {hero} a name tag'] },
      { g:'Care buttons — feed, play, and pet {hero}.', c:['add a Feed button that gives {hero} a snack','add a Play button for a little game','make {hero} react when I pet it'] },
      { g:'The rule of pets: keep {hero} happy — needs go down over time!', c:['add hunger and happiness that slowly drop','make {hero} look sad when needs are low','feeding and playing fill the needs back up'] },
      { g:'Show the stats — hearts and bars for {hero}\'s mood.', c:['add bars for hunger and happiness','add hearts that fill up','show {hero}\'s mood with faces'] },
      { g:'Make {hero} feel real — sounds, wiggles, snuggles.', c:['add a happy sound when I feed {hero}','make {hero} bounce when it\'s happy','add little hearts when I pet it'] },
      { g:'Decorate {world} — toys, colors, coziness.', c:['decorate {world} with fun details','add toys lying around','make it cozier at night'] },
      { g:'Growing up — {hero} levels up with your care!', c:['make {hero} grow bigger with care','unlock a new toy at happiness 100','add a day counter for how long {hero} has lived'] }
    ],
    draw: [
      { g:'Set up the studio — canvas in the middle, title up top.', c:['add the title {world} and a big white canvas','put the tools on the side','tidy the layout'] },
      { g:'The star tool: a pen that draws when you move.', c:['let me draw on the canvas with my mouse or finger','make the lines smooth','start with a black pen'] },
      { g:'Add the toolbox — colors and brush sizes.', c:['add a row of color buttons','add small, medium, and big brush sizes','add an eraser'] },
      { g:'Artist powers — {hero}!', c:['add {hero}','add a rainbow brush that changes colors','add fun stamps I can place'] },
      { g:'Studio controls — clear, undo, and save.', c:['add a Clear Canvas button','add an Undo button','add a Save My Art button that downloads it'] },
      { g:'Make it playful — sounds and sparkles while you draw.', c:['add a soft sound while drawing','make the buttons pop when pressed','add a sparkle trail brush'] },
      { g:'Style the studio — make {world} feel like YOUR space.', c:['style the whole studio to feel like {world}','make the toolbar look professional','add a fun pattern around the canvas'] },
      { g:'Gallery mode — save more, show more.', c:['add a gallery that keeps 3 drawings','add a background-color picker for the canvas','add a mirror-drawing mode'] }
    ],
    journal: [
      { g:'Craft the cover — {world} style, your name on it.', c:['add a {world}-style cover with a title','add an Open My Journal button','tidy the layout'] },
      { g:'The first page — a place to write {hero}.', c:['add a page where I can type','make the page look like real paper','add today\'s date at the top'] },
      { g:'Save your entries — they stay when you come back.', c:['add a Save Entry button','keep my saved entries in a list','let me tap an old entry to read it'] },
      { g:'Sticker power — decorate every entry.', c:['add stickers I can add to a page','add 10 fun emoji stickers to choose from','let me put stickers anywhere on the page'] },
      { g:'Journal stats — streaks and counts.', c:['count my total entries','add a writing streak counter','show my longest entry'] },
      { g:'Make it delightful — page turns and little sounds.', c:['add a page-turn effect','add a soft click when I save','celebrate a 3-day streak'] },
      { g:'Make it truly {world} — fonts, colors, secrets.', c:['style everything in the {world} theme','add a secret password screen at the start','let me pick the page color'] },
      { g:'Power features — moods and prompts.', c:['add a mood picker for each entry','add a "give me an idea" button with writing prompts','add a favorites star for best entries'] }
    ],
    music: [
      { g:'Build the booth — {world}\'s stage, name in lights.', c:['add the DJ name {world} in big letters','make a dark stage background','tidy the layout'] },
      { g:'Drop in the pads — a colorful grid ready to play.', c:['add a 4x4 grid of colorful pads','make each pad a different color','make the pads big and tappable'] },
      { g:'Make them sing — every pad plays {hero}.', c:['make each pad play a different sound','make the pads light up when played','let me play with keyboard keys too'] },
      { g:'The beat goes on — add a looping drum beat.', c:['add a beat that loops when I press Play','add a Stop button','let me change the beat speed'] },
      { g:'Show the groove — visualize your music.', c:['add bouncing bars that dance to the music','count how many sounds I\'ve played','flash the background on the beat'] },
      { g:'More feels — echo, boosts, and surprises.', c:['add an echo button','add one secret pad with a silly sound','make a pad that plays a melody'] },
      { g:'Light show — style the stage like a real concert.', c:['add moving lights to the stage','give it a neon glow style','make it feel like a concert for {world}'] },
      { g:'Record mode — capture and replay your beats.', c:['let me record a sequence of pads','add a Replay button that plays it back','let me save my favorite beat'] }
    ],
    story: [
      { g:'The book opens — title page for your adventure in {world}.', c:['add a title page for my story','add a Begin button','give it a storybook look'] },
      { g:'Page one — {hero} arrives in {world}.', c:['write the opening scene where {hero} arrives in {world}','add a picture area with emoji art for the scene','make the text big and easy to read'] },
      { g:'The magic: choices! Two buttons that change the story.', c:['add 2 choice buttons at the end of the page','each choice leads to a different page','let me go back a page'] },
      { g:'Grow the tale — every path needs its next chapter.', c:['add the next 4 pages of the story','give one path a happy turn and one a spooky turn','add a third choice somewhere surprising'] },
      { g:'Track the journey — pages seen, paths found.', c:['count which page I\'m on','track how many endings I\'ve found','add a map of the story paths'] },
      { g:'Make pages come alive — scene by scene.', c:['different background color per scene','add a gentle page-turn effect','add emoji art to every page'] },
      { g:'Illustrate {world} — style the whole book.', c:['style the book to match {world}','add a fancy title font','make the choice buttons look magical'] },
      { g:'The endings — write the finales!', c:['add 3 different endings','add a "The End" screen that shows which ending I got','add a Start Over button'] }
    ],
    world: [
      { g:'Draw the map — {hero} from above, ready to explore.', c:['add a title and draw the map of {hero}','add 4 places to visit on the map','tidy the layout'] },
      { g:'The landmarks — make each place lookable and clickable.', c:['make each place a big clickable spot','give each place a name label','add emoji art for each place'] },
      { g:'Step inside — clicking a place opens its page.', c:['clicking a place shows its own page','add a Back to Map button','add a description of each place'] },
      { g:'Bring it to life — visitors can {world}.', c:['let visitors {world}','add a character who says hi in each place','add one secret to find in each place'] },
      { g:'Explorer stats — track the visit.', c:['check off each place I\'ve visited','add a visitor counter','show a badge when everything is explored'] },
      { g:'Add the sounds of {hero} — each place feels different.', c:['different colors per place','a little sound when entering a place','make something move in each place'] },
      { g:'Beautify the world — your style everywhere.', c:['make the map gorgeous','add day and night mode','add weather like rain or snow'] },
      { g:'Expand the world — new places, new secrets.', c:['add 2 brand-new places','add a hidden place that unlocks after visiting all others','add a tour-guide character'] }
    ]
  };

  var qs = new URLSearchParams(location.search);
  var mn = parseInt(qs.get('mission')||'0',10);
  if(!mn || mn<1 || mn>12) mn = Math.min(12, getProgress()+1);
  var layer = LAYERS[mn-1];

  // Personalize checkpoints 2–9 from the kid's saved dream: swap in the
  // per-kind blueprint and fill {hero}/{world} with THEIR choices.
  (function(){
    var d = dream(); if(!d || !d.kind || !BLUEPRINTS[d.kind]) return;
    var hero = (d.hero||'').trim() || 'your star', world = (d.world||'').trim() || 'your world';
    function fill(s){ return s.replace(/\{hero\}/g, hero).replace(/\{world\}/g, world); }
    if(mn>=2 && mn<=9){
      var bp = BLUEPRINTS[d.kind][mn-2];
      if(bp){ layer = { icon:layer.icon, title:layer.title, guide:fill(bp.g), chips:bp.c.map(fill) }; }
    }
  })();

  var state = { current:getProject(), built:false, idea:'' };
  var iframe, building, cinput, contBtn;

  // ======================= INTRO =======================
  function renderIntro(){
    var s=$('intro'); s.innerHTML='';
    s.appendChild(el('p','kicker','🌉 The Big Build · Checkpoint '+mn+' of 12'));
    s.appendChild(el('h1','t-big', layer.icon+' '+esc(layer.title)));
    var d=dream();
    if(layer.kickoff){
      s.appendChild(el('p','lede','Welcome to the bridge, '+esc(name)+'! Over 12 checkpoints you\'ll build your very own app or game — one layer at a time — and show it to your family at the end. First: what are we making?'));
      var card=el('div','dreamcard');
      var ta;
      if(d&&d.seed){
        card.appendChild(el('div',null,'<div style="font-size:2rem">'+esc(d.icon||'🌟')+'</div><div style="font-weight:700;font-family:var(--display);font-size:1.1rem;margin:4px 0 10px">Your dream: '+esc(d.label||'your build')+'</div>'));
      } else {
        card.appendChild(el('div',null,'<div style="font-weight:700;margin-bottom:6px">Pick a starting idea:</div>'));
        var chips=el('div','chips'); layer.chips.forEach(function(c){ var b=el('button','chip', c); b.addEventListener('click',function(){ ta.value='Build me '+c+'.'; ta.focus(); }); chips.appendChild(b); }); card.appendChild(chips);
      }
      card.appendChild(el('div',null,'<div style="font-weight:700;margin:2px 0 8px">'+(d&&d.seed?'Here\'s what you told us — tweak it if you want, then build!':'Describe your dream — add your own flair!')+'</div>'));
      ta=el('textarea','ta'); ta.maxLength=500; ta.placeholder='I want to build…'; ta.value=(d&&d.seed)?d.seed:''; card.appendChild(ta);
      var go=el('button','btn','✨  Start building!'); go.style.marginTop='14px';
      go.addEventListener('click',function(){ var v=ta.value.trim(); if(!v){ ta.focus(); return; } if(!clean(v)) return; state.idea=v; openStudio(); build({ idea:v }); });
      card.appendChild(go); s.appendChild(card);
    } else if(layer.publish){
      s.appendChild(el('p','lede','This is the last layer, '+esc(name)+' — time to <b>ship it</b>. Let\'s put your creation on the internet so you can show it off at the library.'));
      if(!state.current) s.appendChild(el('p','lede','Hmm — I can\'t find your project yet. Pop back to an earlier checkpoint to build first!'));
      var go=el('button','btn green','🚀  Publish my creation'); go.style.marginTop='8px';
      go.addEventListener('click',function(){ if(!state.current){ toast('Build something at the earlier checkpoints first!'); return; } show('publish'); renderPublish(); });
      s.appendChild(go); s.appendChild(backLink());
    } else {
      s.appendChild(el('p','lede','<b>'+esc(name)+'</b>, your project so far is ready. This checkpoint, you\'ll add one new layer: <b>'+esc(layer.title)+'</b>.'));
      var go2=el('button','btn','▶  Open my project'); go2.style.marginTop='6px';
      go2.addEventListener('click',function(){ openStudio(); if(state.current) showPreview(state.current); });
      s.appendChild(go2); s.appendChild(backLink());
    }
  }
  function backLink(){ var a=el('a','btn ghost','‹ Back to the map'); a.href='/platform/missions.html'; a.style.cssText='margin-top:16px'; return a; }

  // ======================= STUDIO =======================
  function openStudio(){ show('studio'); renderStudio(); }
  function renderStudio(){
    var s=$('studio'); s.innerHTML='';
    var pct=Math.round(((mn-1)/12)*100);
    var h=el('div','shead');
    h.innerHTML='<span class="lico">'+layer.icon+'</span><div class="st">'+esc(layer.title)+'<small>Checkpoint '+mn+' / 12</small></div>'+
      '<div class="prog"><div class="bar"><i style="width:'+pct+'%"></i></div><button class="exit" id="shExit">Save & exit</button></div>';
    s.appendChild(h);
    s.appendChild(el('div','guide','👉 '+layer.guide));
    var w=el('div','preview-wrap');
    w.innerHTML='<div class="preview-empty" id="pvEmpty"><div class="pe-ic">🪄</div><div>'+(layer.kickoff?'Your creation will appear here…':'Loading your project…')+'</div></div>'+
      '<iframe id="pv" sandbox="allow-scripts allow-pointer-lock" referrerpolicy="no-referrer" title="Your creation"></iframe>'+
      '<div class="building" id="building"><div class="spin"></div><div class="bmsg" id="bmsg">Building…</div></div>';
    s.appendChild(w);
    var c=el('div','controls');
    c.innerHTML='<div class="qchips" id="qchips"></div><div class="cbar"><input id="cinput" placeholder="Tell the AI what to add or change…" maxlength="200"><button class="btn" id="cgo">Build</button><button class="btn green" id="cont" disabled>Save layer ✓</button></div>';
    s.appendChild(c);
    iframe=$('pv'); building=$('building'); cinput=$('cinput'); contBtn=$('cont'); iframe.style.display='none';
    var qc=$('qchips'); (layer.chips||[]).forEach(function(q){ var b=el('button','qchip', layer.kickoff?('Build me '+q):q); b.addEventListener('click',function(){ cinput.value=layer.kickoff?('Build me '+q+'.'):q; doBuild(); }); qc.appendChild(b); });
    $('cgo').addEventListener('click', doBuild);
    cinput.addEventListener('keydown',function(e){ if(e.key==='Enter') doBuild(); });
    contBtn.addEventListener('click', saveLayer);
    $('shExit').addEventListener('click', function(){ if(state.built) setProject(state.current); location.href='/platform/missions.html'; });
    if(state.current) showPreview(state.current);
  }
  function setBuilding(on,msg){ if(!building)return; building.classList.toggle('on',on); if(msg)$('bmsg').textContent=msg; }
  function showPreview(html){ state.current=html; $('pvEmpty').style.display='none'; iframe.style.display='block'; iframe.srcdoc=html; }
  function doBuild(){
    var v=(cinput.value||'').trim();
    if(layer.kickoff && !v && state.idea) v=state.idea;
    if(!v){ if(!state.current) toast('Type what you want to build first!'); return; }
    if(!clean(v)) return;
    cinput.value='';
    if(state.current && !layer.kickoff) build({ current:state.current, change:v });
    else build({ idea:v });
  }
  function build(payload){
    setBuilding(true, payload.change?('Adding your '+layer.title.toLowerCase()+'…'):'Building your idea…');
    fetch('/api/buildstudio',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) })
      .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,d:d}; }); })
      .then(function(res){ setBuilding(false);
        if(res.ok && res.d.html){ showPreview(res.d.html); state.built=true; if(contBtn){ contBtn.disabled=false; if(mn>=12) contBtn.textContent='Publish 🚀'; } }
        else toast((res.d&&res.d.error)||'The AI got stuck — try again.'); })
      .catch(function(){ setBuilding(false); toast('Couldn\'t reach the AI — check your connection and try again.'); });
  }
  function saveLayer(){
    if(!state.built){ toast('Build this layer first!'); return; }
    setProject(state.current); setProgress(mn);
    try{ if(window.CTFDB && CTFDB.enabled && CTFDB.awardBadge) CTFDB.awardBadge('kids-mod4-'+mn, { module:'module-04-build-your-own', track:'kids' }); }catch(e){}
    if(layer.publish || mn>=12){ show('publish'); renderPublish(); return; }
    show('done'); renderDone();
  }
  function clean(v){ if(window.CTFFilter && CTFFilter.isClean && !CTFFilter.isClean(v)){ toast('Let\'s keep it kind and fun.'); return false; } return true; }

  // ======================= LAYER DONE =======================
  function renderDone(){
    var s=$('done'); s.innerHTML=''; burst();
    var next=LAYERS[mn];
    s.appendChild(el('p','kicker','✓ Checkpoint '+mn+' complete'));
    s.appendChild(el('h1','t-big','Layer added: <span class="grad">'+esc(layer.title)+'</span>'));
    s.appendChild(el('p','lede','Nice work, '+esc(name)+'! Your project just grew. '+(next?('Next checkpoint: <b>'+esc(next.title)+'</b> '+next.icon):'')));
    var map=el('a','btn','🗺️  Back to the bridge'); map.href='/platform/missions.html'; map.style.marginTop='18px';
    s.appendChild(map);
  }

  // ======================= PUBLISH =======================
  function renderPublish(){
    var s=$('publish'); s.innerHTML='';
    s.appendChild(el('p','kicker','🚀 The final checkpoint'));
    s.appendChild(el('h1','t-big','Ship it & <span class="grad">show it off</span>'));
    s.appendChild(el('p','lede','Give your creation a name. We\'ll save it and get it live on the web — ready to present to your family at the library!'));
    var card=el('div','pubcard');
    card.appendChild(el('div',null,'<div style="font-weight:700;margin-bottom:4px">Name your creation</div>'));
    var inp=el('input'); inp.maxLength=40; inp.value=((dream()&&dream().label)||'My Creation'); card.appendChild(inp);
    var row=el('div'); row.style.cssText='display:flex;gap:10px;flex-wrap:wrap;justify-content:center';
    var pub=el('button','btn green','🚀  Publish it!'); var back=el('button','btn ghost','‹ Keep tweaking');
    row.appendChild(pub); row.appendChild(back); card.appendChild(row);
    var done=el('div'); done.id='pubDone'; done.style.marginTop='16px'; card.appendChild(done);
    s.appendChild(card);
    back.addEventListener('click',function(){ openStudio(); showPreview(state.current); });
    pub.addEventListener('click',function(){
      var title=(inp.value.trim()||'My Creation').slice(0,40);
      var sl=title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'creation';
      var rec={ title:title, slug:sl, by:name, html:state.current, when:new Date().toISOString() };
      try{ localStorage.setItem('ctf:creation', JSON.stringify(rec)); }catch(e){}
      try{ var blob=new Blob([state.current],{type:'text/html'}); var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=sl+'.html'; a.click(); }catch(e){}
      try{ if(window.CTFDB && CTFDB.enabled && CTFDB.saveCreation) CTFDB.saveCreation(rec); }catch(e){}
      setProgress(12);
      try{ if(window.CTFDB && CTFDB.enabled && CTFDB.awardBadge) CTFDB.awardBadge('kids-mod4-12', { module:'module-04-build-your-own', track:'kids' }); localStorage.setItem('ctf:bigmission4:done','1'); }catch(e){}
      burst(); pub.textContent='✅ Published!'; pub.disabled=true;
      done.innerHTML='<div style="background:rgba(63,208,138,.14);border:1px solid rgba(63,208,138,.4);border-radius:14px;padding:16px;line-height:1.5">'+
        '🎉 <b>'+esc(title)+'</b> is saved and ready to go live at<br><span style="font-family:var(--mono);color:#9BF5C7">studentdemos.codethefuture.net/'+esc(sl)+'</span><br>'+
        'A grown-up will pop it onto the internet — then you can show your family at the library. You built and shipped your own creation! 🚀</div>'+
        '<a class="btn" href="/platform/missions.html" style="margin-top:14px">🗺️ Back to the map</a>';
    });
  }

  function show(id){ ['intro','studio','done','publish'].forEach(function(x){ $(x).classList.toggle('on', x===id); }); }
  var toastT; function toast(m){ var t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove('on'); }, 3200); }
  function burst(){ var c=el('div','confetti'); document.body.appendChild(c); var cols=['#9B7BFF','#FFD479','#7FE3FF','#3FD08A','#3D74FF','#fff'];
    for(var i=0;i<70;i++){ var x=el('i'); x.style.left=Math.random()*100+'%'; x.style.background=cols[i%cols.length]; x.style.animationDuration=(1.6+Math.random()*1.8)+'s'; x.style.animationDelay=(Math.random()*.5)+'s'; x.style.transform='rotate('+(Math.random()*360)+'deg)'; c.appendChild(x); }
    setTimeout(function(){ c.remove(); }, 4000); }

  renderIntro();
})();
</script>
</body>
</html>
