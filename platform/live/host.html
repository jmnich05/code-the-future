<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/platform/assets/logo-icon-tile.svg">
<title>Live Room · Host — Code the Future</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap');
:root{ --display:'Space Grotesk',sans-serif; --body:'Plus Jakarta Sans',system-ui,sans-serif; --mono:'JetBrains Mono',monospace; --purple:#9B7BFF; --teal:#26C7D1; --green:#3FD08A; }
*{ box-sizing:border-box; margin:0; }
html,body{ height:100%; }
body{ font-family:var(--body); color:#EAF1FF; height:100vh; display:flex; flex-direction:column; overflow:hidden;
  background:radial-gradient(120% 90% at 82% -10%, rgba(155,123,255,.25), transparent 55%),
  radial-gradient(120% 90% at 8% 110%, rgba(38,199,209,.22), transparent 55%),
  linear-gradient(165deg,#101a3c,#0A1024 55%,#070C1A); }
.hd{ flex:0 0 auto; display:flex; align-items:center; gap:14px; padding:16px 26px; border-bottom:1px solid rgba(255,255,255,.1); }
.hd .logo{ display:flex; align-items:center; gap:9px; font-family:var(--display); font-weight:700; font-size:1.1rem; }
.hd .logo img{ width:30px; height:30px; }
.hd .logo span{ color:var(--teal); }
.hd .sess{ font-family:var(--mono); font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--purple); }
.hd .modsw{ display:flex; gap:6px; }
.hd .modsw a{ font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.06em; text-decoration:none; color:#9fb6e6;
  border:1px solid rgba(255,255,255,.18); border-radius:999px; padding:4px 11px; }
.hd .modsw a.on{ color:#06122b; background:linear-gradient(120deg,#9fb6ff,#9B7BFF); border-color:transparent; }
.hd .tycoonlink{ font-family:var(--display); font-weight:700; font-size:12px; letter-spacing:.04em; text-decoration:none; color:#3a2200;
  background:linear-gradient(120deg,#FFD479,#FFB320); border-radius:999px; padding:6px 13px; box-shadow:0 4px 12px rgba(255,179,32,.35); }
.hd .joined{ margin-left:auto; font-family:var(--mono); font-size:13px; color:#9BF5C7; }
.stage{ position:relative; flex:1 1 auto; display:flex; flex-direction:column; align-items:center; justify-content:safe center; padding:20px 40px; text-align:center; overflow-y:auto; min-height:0; }
.kick{ font-family:var(--mono); font-size:14px; letter-spacing:.22em; text-transform:uppercase; color:var(--purple); margin-bottom:12px; }
.qe{ font-size:4.2rem; margin-bottom:6px; }
h1{ font-family:var(--display); font-weight:700; font-size:clamp(2rem,4.5vw,3.4rem); line-height:1.08; letter-spacing:-.02em; max-width:22ch; }
.sub{ font-size:1.25rem; opacity:.88; max-width:56ch; margin-top:12px; line-height:1.5; }
.url{ font-family:var(--mono); font-size:clamp(1.2rem,2.6vw,1.9rem); color:#9BF5C7; background:rgba(63,208,138,.1); border:1.5px solid rgba(63,208,138,.4); border-radius:16px; padding:14px 26px; margin-top:20px; }
.joinrow{ display:flex; align-items:center; justify-content:center; gap:30px; margin-top:22px; flex-wrap:wrap; }
.qrcard{ background:#fff; border-radius:18px; padding:16px; box-shadow:0 16px 40px rgba(0,0,0,.45); }
.qrcard .qr{ width:clamp(150px,20vw,220px); height:clamp(150px,20vw,220px); display:block; }
.qrcard .scan{ font-family:var(--display); font-weight:700; font-size:.95rem; color:#0A1024; text-align:center; margin-top:8px; letter-spacing:.02em; }
.joincol{ display:flex; flex-direction:column; align-items:center; gap:6px; }
.joincol .or{ font-family:var(--mono); font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:#9fb6e6; }
/* sizzle reel: lobby button + fullscreen overlay */
.reelbtn{ margin-top:18px; font-family:var(--display); font-weight:700; font-size:1.15rem; color:#06122b; border:none; cursor:pointer;
  padding:15px 30px; border-radius:999px; background:linear-gradient(120deg,#FFD479,#FFB320); box-shadow:0 12px 30px rgba(255,179,32,.4); }
.reelbtn:hover{ transform:translateY(-2px); }
.reelwrap{ position:fixed; inset:0; z-index:200; background:#000; display:none; align-items:center; justify-content:center; }
.reelwrap.on{ display:flex; }
.reelwrap video{ width:100%; height:100%; object-fit:contain; }
.reelclose{ position:absolute; top:18px; right:22px; z-index:201; font-family:var(--display); font-weight:700; font-size:1rem; color:#fff;
  background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.3); border-radius:999px; padding:10px 20px; cursor:pointer; }
.people{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:24px; max-width:900px; }
.pp{ display:inline-flex; align-items:center; gap:9px; font-family:var(--display); font-weight:700; font-size:1.05rem; background:rgba(155,123,255,.18); border:1.5px solid rgba(155,123,255,.45); border-radius:999px; padding:7px 20px 7px 8px; animation:pop .3s; }
.pp .ppav{ width:34px; height:34px; border-radius:10px; overflow:hidden; flex:none; }
.pp .ppav svg, .lrow .lav svg{ width:100%; height:100%; display:block; }
.lrow .lav{ width:46px; height:46px; border-radius:12px; overflow:hidden; flex:none; box-shadow:0 3px 0 rgba(0,0,0,.25); }
@keyframes pop{ from{ transform:scale(.6); opacity:0; } }
.bars{ display:grid; gap:14px; width:min(860px,92%); margin-top:26px; }
.brow{ display:grid; grid-template-columns:56px 1fr 90px; align-items:center; gap:14px; text-align:left; animation:rowin .45s cubic-bezier(.34,1.56,.64,1) both; }
.brow:nth-child(2){ animation-delay:.08s; } .brow:nth-child(3){ animation-delay:.16s; } .brow:nth-child(4){ animation-delay:.24s; }
@keyframes rowin{ from{ opacity:0; transform:translateX(-30px); } }
.brow .be{ font-size:1.8rem; text-align:center; width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; color:#fff;
  box-shadow:0 5px 0 rgba(0,0,0,.3); }
.brow.o0 .be{ background:linear-gradient(160deg,#FF7452,#E23F1C); } .brow.o1 .be{ background:linear-gradient(160deg,#5C8BFF,#2A5FF0); }
.brow.o2 .be{ background:linear-gradient(160deg,#FFC44D,#E8930C); color:#3a2200; } .brow.o3 .be{ background:linear-gradient(160deg,#54E29B,#1FA864); color:#04331f; }
.brow .bl{ position:relative; height:56px; background:rgba(255,255,255,.07); border:1.5px solid rgba(127,227,255,.25); border-radius:14px; overflow:hidden; }
.brow .bf{ position:absolute; inset:0 auto 0 0; width:0%; transition:width .5s cubic-bezier(.22,1,.36,1); }
.brow.o0 .bf{ background:linear-gradient(90deg,rgba(255,116,82,.5),rgba(226,63,28,.45)); } .brow.o1 .bf{ background:linear-gradient(90deg,rgba(92,139,255,.5),rgba(42,95,240,.45)); }
.brow.o2 .bf{ background:linear-gradient(90deg,rgba(255,196,77,.5),rgba(232,147,12,.4)); } .brow.o3 .bf{ background:linear-gradient(90deg,rgba(84,226,155,.5),rgba(31,168,100,.45)); }
.brow.correct .bl{ border-color:var(--green); box-shadow:0 0 0 4px rgba(63,208,138,.35), 0 0 24px rgba(63,208,138,.4); }
.brow.correct .be{ animation:crownpop .55s cubic-bezier(.34,1.56,.64,1); }
@keyframes crownpop{ 40%{ transform:scale(1.25) rotate(-5deg); } }
.brow.dimmed{ opacity:.35; filter:grayscale(.6); }
.vidwrap{ width:min(960px,94%); aspect-ratio:16/9; margin-top:22px; border-radius:18px; overflow:hidden; border:2px solid rgba(127,227,255,.35); box-shadow:0 26px 70px rgba(0,0,0,.6); }
.vidwrap iframe{ width:100%; height:100%; border:0; display:block; }
.brow .bt{ position:relative; z-index:1; display:flex; align-items:center; height:100%; padding:0 16px; font-family:var(--display); font-weight:700; font-size:1.15rem; }
.brow .bc{ font-family:var(--mono); font-weight:700; font-size:1.5rem; text-align:right; color:#cfe3ff; }
.why{ margin-top:22px; font-size:1.2rem; line-height:1.5; max-width:60ch; background:rgba(63,208,138,.1); border:1.5px solid rgba(63,208,138,.4); border-radius:16px; padding:16px 22px; color:#d7ffe9; display:none; }
.why.on{ display:block; }
.acount{ font-family:var(--mono); font-size:13px; color:#9fb6e6; margin-top:16px; }
.dgrid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; width:min(1100px,94%); margin-top:22px; }
@media(max-width:900px){ .dgrid{ grid-template-columns:repeat(2,1fr); } }
.dcell{ background:rgba(255,255,255,.05); border:1.5px solid rgba(127,227,255,.2); border-radius:16px; padding:12px; min-height:96px; }
.dcell.has{ border-color:var(--green); background:rgba(63,208,138,.08); }
.dcell .de{ font-size:1.5rem; } .dcell .dl{ font-family:var(--display); font-weight:700; font-size:.85rem; }
.dcell .dn{ margin-top:6px; font-size:.8rem; color:#9BF5C7; line-height:1.45; }
.lead{ display:grid; gap:10px; width:min(560px,92%); margin-top:24px; }
.lrow{ display:flex; align-items:center; gap:14px; background:rgba(255,255,255,.06); border:1.5px solid rgba(127,227,255,.25); border-radius:14px; padding:12px 18px; font-family:var(--display); font-weight:700; font-size:1.2rem; text-align:left; }
.lrow .medal{ font-size:1.6rem; } .lrow .pts{ margin-left:auto; font-family:var(--mono); color:#9BF5C7; }
.ctrl{ flex:0 0 auto; display:flex; gap:10px; align-items:center; justify-content:center; padding:14px 20px calc(14px + env(safe-area-inset-bottom)); border-top:1px solid rgba(255,255,255,.1); background:rgba(6,10,22,.55); }
.cb{ font-family:var(--display); font-weight:700; font-size:1rem; border:none; cursor:pointer; border-radius:999px; padding:13px 26px; color:#fff; background:rgba(255,255,255,.1); }
.cb.primary{ color:#06122b; background:linear-gradient(120deg,#9fb6ff,#9B7BFF); }
.cb.reveal{ color:#06223b; background:linear-gradient(120deg,#7ef0e6,#26C7D1); }
.cb:disabled{ opacity:.35; cursor:not-allowed; }
.ctrl .pos{ font-family:var(--mono); font-size:12px; color:#9fb6e6; margin:0 8px; }
.gatemsg{ margin:auto; text-align:center; }
/* ---- always-on live scoreboard (top right, every stage) ---- */
.livesb{ position:fixed; top:70px; right:18px; z-index:60; width:min(280px,26vw); background:rgba(8,13,28,.82); backdrop-filter:blur(10px);
  border:1.5px solid rgba(127,227,255,.28); border-radius:16px; padding:11px 13px; box-shadow:0 18px 44px rgba(0,0,0,.5); display:none; }
.livesb.on{ display:block; }
.livesb .sbh{ font-family:var(--mono); font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:#7ef0e6; margin-bottom:8px; text-align:center; }
.livesb .sbrow{ display:flex; align-items:center; gap:8px; padding:4px 0; font-family:var(--display); font-weight:700; font-size:.95rem; }
.livesb .sbrow .m{ font-size:1.05rem; width:22px; flex:none; text-align:center; }
.livesb .sbav{ width:28px; height:28px; border-radius:8px; overflow:hidden; flex:none; }
.livesb .sbav svg{ width:100%; height:100%; display:block; }
.livesb .sbn{ flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.livesb .sbp{ font-family:var(--mono); color:#9BF5C7; flex:none; }
.livesb .sbrow.lead .sbn{ color:#FFD479; }
@media(max-width:900px){ .livesb{ display:none !important; } }
/* ---- full-screen real-news story ---- */
.storywrap{ width:min(1180px,94%); }
.storywrap .stitle{ font-family:var(--display); font-weight:700; font-size:clamp(1.5rem,3vw,2.5rem); line-height:1.1; letter-spacing:-.02em; margin-bottom:4px; }
.storywrap .scols{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px; text-align:left; }
@media(max-width:980px){ .storywrap .scols{ grid-template-columns:1fr; } }
.scard{ background:rgba(255,255,255,.05); border:1.5px solid rgba(127,227,255,.24); border-radius:18px; padding:14px 18px; }
.scard.means{ border-color:rgba(63,208,138,.4); background:rgba(63,208,138,.07); }
.scard .sh{ font-family:var(--mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:#7ef0e6; margin-bottom:10px; }
.scard.means .sh{ color:#9BF5C7; }
.scard p{ font-size:clamp(.95rem,1.3vw,1.15rem); line-height:1.45; margin-bottom:9px; }
.scard p:last-child{ margin-bottom:0; }
.storywrap .sask{ margin-top:14px; font-family:var(--display); font-weight:700; font-size:clamp(1rem,1.6vw,1.32rem); color:#FFD98C;
  background:rgba(255,196,77,.12); border:1.5px solid rgba(255,196,77,.42); border-radius:16px; padding:12px 20px; }
.story-warn .scard{ border-color:rgba(255,116,82,.4); }
.story-warn .scard.means{ border-color:rgba(255,196,77,.45); background:rgba(255,196,77,.09); }
</style>
</head>
<body>
<div class="hd">
  <div class="logo"><img src="/platform/assets/logo-icon-tile.svg" alt="">Code the <span>Future</span></div>
  <div class="sess" id="sess"></div>
  <div class="modsw" id="modsw"></div>
  <a class="tycoonlink" id="tycoonLink" href="tycoon.html" target="_blank" rel="noopener">🏢 Tycoon game →</a>
  <div class="joined" id="joined">0 in the room</div>
</div>
<div class="stage" id="stage"><div class="gatemsg"><h1>Connecting…</h1></div></div>
<div class="livesb" id="livesb"></div>
<div class="reelwrap" id="reelwrap">
  <button class="reelclose" id="reelclose">✕ Close</button>
  <video id="reelvid" playsinline controls></video>
</div>
<div class="ctrl">
  <button class="cb" id="prev">‹ Back</button>
  <span class="pos" id="pos"></span>
  <button class="cb reveal" id="reveal">Reveal ✓</button>
  <button class="cb primary" id="next">Next ›</button>
  <button class="cb" id="reset" title="Clear the scoreboard for a fresh game">↺ Scores</button>
</div>

<script src="/platform/lib/config.js"></script>
<script src="/platform/lib/avatar.js"></script>
<script>
  // default = the CURRENT session's module (kids just type /platform/live/)
  var _m = (new URLSearchParams(location.search).get('m')||'4').replace(/[^0-9]/g,'')||'4';
  document.write('<script src="config-m'+_m+'.js"><\/script>');
</script>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const S = window.LIVE_SESSION;
const stageEl = document.getElementById('stage');
const esc = (s)=>String(s==null?'':s).replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('sess').textContent = S.title;

// module switcher — add each module here as its config-mN.js ships. Clicking
// reloads the host in that room; the lobby announcement makes every kid
// device hop over automatically.
const SESSIONS = ['1','2','3','4'];
const _cur = (S.id||'m1').replace(/\D/g,'')||'1';
document.getElementById('modsw').innerHTML = SESSIONS.map(n=>
  '<a href="?m='+n+'" class="'+(n===_cur?'on':'')+'">M'+n+'</a>').join('');
// the Tycoon big-game is part of the Module 2 session only
document.getElementById('tycoonLink').style.display = (_cur==='2') ? '' : 'none';

// ---- always-on live scoreboard (top-right corner, every stage) -------------
function renderLiveSB(){
  const el=document.getElementById('livesb'); if(!el) return;
  const top=tally().slice(0,6);
  if(!top.length){ el.classList.remove('on'); el.innerHTML=''; return; }
  const medals=['🥇','🥈','🥉','🏅','🏅','🏅'];
  el.innerHTML='<div class="sbh">⭐ Live scoreboard</div>'+top.map((p,i)=>
    '<div class="sbrow'+(i===0?' lead':'')+'"><span class="m">'+medals[i]+'</span>'+
    '<span class="sbav">'+av(avatars[p.uid])+'</span>'+
    '<span class="sbn">'+esc(p.name)+'</span><span class="sbp">'+p.score+'</span></div>').join('');
  el.classList.add('on');
}

// soft staff check — the room is cohort-gated anyway; this keeps kids out of the controls
if(localStorage.getItem('ctf:unlockall')!=='1'){
  stageEl.innerHTML='<div class="gatemsg"><div class="qe">🔒</div><h1>Host screen is staff-only</h1><p class="sub">Log in on the Staff tab first, then come back. (Kids join at <b>codethefuture.net/platform/live/</b>)</p></div>';
  throw new Error('staff-only');
}

let idx=0, revealed=false, channel=null;
const answers={};              // act -> { uid: {name, choice} }
const dreams={};               // uid -> { name, icon, label, hero, world }
const kids={};                 // uid -> name (presence)
const avatars={};              // uid -> avatar config (the character each kid built)
const av=(cfg)=>window.CTFAvatar ? window.CTFAvatar.render(cfg && Object.keys(cfg).length ? cfg : window.CTFAvatar.DEFAULT) : '';
// QR to codethefuture.net/platform/live/ — kids scan it to join (also printable

// The scoreboard is computed live from every answer collected, so it's always
// right whether or not the coach pressed Reveal on each question. Answers
// persist so a host reload / module hop can't wipe the board; the ↺ Scores
// button clears them for a fresh game.
const SAVEKEY='ctf:live:'+S.id+':state';
try{ const sv=JSON.parse(localStorage.getItem(SAVEKEY)||'null');
  if(sv && sv.answers){ Object.assign(answers, sv.answers); } }catch(e){}
function persist(){ try{ localStorage.setItem(SAVEKEY, JSON.stringify({ answers })); }catch(e){} }
function tally(){               // uid -> {name, score}, summed across every scored round
  const sc={};
  S.stages.forEach(st=>{
    if(st.type!=='vote' || st.answer==null) return;   // skip lobby, opinion polls, boards
    const a=answers[st.id]||{};
    Object.keys(a).forEach(u=>{ if(a[u].choice===st.answer){ (sc[u]=sc[u]||{name:a[u].name,score:0}).score++; sc[u].name=a[u].name; } });
  });
  return Object.keys(sc).map(u=>({ uid:u, name:sc[u].name, score:sc[u].score })).sort((x,y)=>y.score-x.score);
}

const URL=window.CTF_SUPABASE_URL, KEY=window.CTF_SUPABASE_ANON_KEY;
const sb = createClient(URL, KEY, { auth:{ persistSession:false } });
channel = sb.channel(S.channel, { config:{ presence:{ key:'host' }, broadcast:{ self:false } } });
channel.on('presence',{event:'sync'},()=>{
  const st=channel.presenceState();
  Object.keys(kids).forEach(k=>delete kids[k]);
  Object.keys(st).forEach(k=>(st[k]||[]).forEach(m=>{ if(m.role==='kid'){ kids[m.uid]=m.name; if(m.avatar) avatars[m.uid]=m.avatar; } }));
  document.getElementById('joined').textContent = Object.keys(kids).length+' in the room';
  render();
});
channel.on('broadcast',{event:'answer'},({payload:p})=>{
  if(!p||!p.act) return;
  (answers[p.act]=answers[p.act]||{})[p.uid]={ name:p.name, choice:p.choice };
  persist(); render();
});
channel.on('broadcast',{event:'dream'},({payload:p})=>{
  if(!p||!p.uid) return; dreams[p.uid]=p; render();
});
channel.subscribe(async (status)=>{ if(status==='SUBSCRIBED'){ await sync(); render(); } });
// announce which module this room is running on the shared lobby channel —
// kid devices at /platform/live/ discover it and auto-join the right session
const _mNum = (S.id||'m1').replace(/\D/g,'')||'1';
const lobby = sb.channel('live:lobby', { config:{ presence:{ key:'host' } } });
lobby.subscribe((st)=>{ if(st==='SUBSCRIBED') lobby.track({ role:'host', m:_mNum }); });

// Heartbeat: re-announce the current stage every 3s. Presence can silently
// break on an individual device; this guarantees every kid keeps getting an
// authoritative "here's where we are" over a second, independent path.
setInterval(()=>{
  if(!channel) return;
  try{ channel.send({ type:'broadcast', event:'stage',
    payload:{ stage:S.stages[idx].id, revealed, beat:true } }); }catch(e){}
}, 3000);
// Throttled presence sync — rapid Back/Next clicking would otherwise burst past
// Supabase Realtime's per-second message limit and get the channel dropped.
let syncT=null, syncLast=0;
function sync(){
  const now=Date.now(), wait=Math.max(0, 350-(now-syncLast));
  clearTimeout(syncT);
  syncT=setTimeout(()=>{
    syncLast=Date.now();
    const stage=S.stages[idx].id;
    channel.track({ role:'host', stage, revealed });
    // second, independent path to the kids: a plain broadcast. If a device
    // missed the presence update (slept through halftime, dropped socket),
    // this catches it — and its own 2s poll catches anything that misses both.
    channel.send({ type:'broadcast', event:'stage', payload:{ stage, revealed } });
  }, wait);
}

// --- controls ---------------------------------------------------------------
function go(d){ idx=Math.max(0,Math.min(S.stages.length-1, idx+d)); revealed=false; sync(); render(); }
function doReveal(){
  const s=S.stages[idx];
  if(revealed || s.type!=='vote') return;
  revealed=true;                                  // the board tallies from answers — no freeze needed
  sync(); render();
}
// blur after every click: a mouse-clicked button keeps focus, so a later space
// press would fire BOTH the shortcut and a re-click of that button — advancing
// two stages, or revealing the next question the instant it loads.
document.getElementById('prev').onclick=(e)=>{ e.currentTarget.blur(); go(-1); };
document.getElementById('next').onclick=(e)=>{ e.currentTarget.blur(); go(1); };
document.getElementById('reveal').onclick=(e)=>{ e.currentTarget.blur(); doReveal(); };
document.getElementById('reset').onclick=(e)=>{ e.currentTarget.blur();
  if(!confirm('Clear the scoreboard and all answers for a fresh game?')) return;
  Object.keys(answers).forEach(k=>delete answers[k]);
  try{ localStorage.removeItem(SAVEKEY); }catch(err){}
  revealed=false; sync(); render(); };
addEventListener('keydown',(e)=>{
  // while the premiere video has focus, the keyboard belongs to the player —
  // otherwise spacebar would SKIP the video instead of pausing it
  if(e.target && e.target.tagName==='VIDEO') return;
  if(e.key===' '){ e.preventDefault(); go(1); }
  else if(e.key==='ArrowRight') go(1);
  else if(e.key==='ArrowLeft') go(-1);
  else if(e.key.toLowerCase()==='r') doReveal();
});

    html='<div class="kick">'+esc(S.title)+'</div><div class="qe">🏆</div><h1>'+esc(s.title)+'</h1><p class="sub">'+esc(s.sub||'')+'</p>'+
      (top.length?('<div class="lead">'+top.map((p,i)=>'<div class="lrow"><span class="medal">'+medals[i]+'</span><span class="lav">'+av(avatars[p.uid])+'</span>'+esc(p.name)+'<span class="pts">'+p.score+' pts</span></div>').join('')+'</div>'):'')+
      (s.href?'<p style="margin-top:26px"><a href="'+s.href+'" target="_blank" rel="noopener" style="display:inline-block;font-weight:800;font-size:clamp(1.05rem,2.6vw,1.5rem);color:#06122b;text-decoration:none;padding:16px 40px;border-radius:99px;background:linear-gradient(120deg,#FFD75E,#FFB320);box-shadow:0 0 30px rgba(255,179,32,.55)">'+(s.hrefLabel||'Continue →')+'</a></p>':'');
  }
  stageEl.innerHTML=html;
  const rp=document.getElementById('reelplay');
  if(rp) rp.onclick=()=>{ const w=document.getElementById('reelwrap'), v=document.getElementById('reelvid');
    v.src=s.reel; w.classList.add('on'); v.play().catch(()=>{}); };
}
document.getElementById('reelclose').onclick=()=>{ const w=document.getElementById('reelwrap'), v=document.getElementById('reelvid');
  v.pause(); v.removeAttribute('src'); v.load(); w.classList.remove('on'); };
document.getElementById('reelvid').addEventListener('ended',()=>{ setTimeout(()=>document.getElementById('reelclose').click(), 1200); });
render();
</script>
</body>
</html>
