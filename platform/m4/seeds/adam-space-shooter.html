<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adam's Space Shooter — v2</title>
<style>
  /* Adam's game. v2: plasma blasters, the asteroid belt, and the shield. */
  html,body{ margin:0; height:100%; background:#050818; overflow:hidden; }
  canvas{ display:block; width:100vw; height:100vh; }
  .hud{ position:fixed; left:14px; top:12px; max-width:52vw; color:#9fb6e6;
    font:600 13px system-ui,sans-serif; letter-spacing:.06em; }
  .hud b{ color:#fff; }
  .bars{ position:fixed; left:14px; top:46px; width:min(220px,44vw); font:700 11px system-ui,sans-serif; letter-spacing:.1em; }
  .bar{ margin-bottom:7px; }
  .bar .lbl{ display:flex; justify-content:space-between; color:#9fb6e6; margin-bottom:3px; }
  .bar .track{ height:11px; border-radius:99px; background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.18); overflow:hidden; }
  .bar .fill{ height:100%; width:100%; border-radius:99px; transition:width .18s; }
  #shieldFill{ background:linear-gradient(90deg,#26C7D1,#7FE3FF); }
  #hullFill{ background:linear-gradient(90deg,#FFB320,#FF7452); }
  .bar.regen .lbl{ color:#9BF5C7; }
  .score{ position:fixed; right:16px; top:12px; text-align:right;
    color:#fff; font:800 26px system-ui,sans-serif; letter-spacing:.04em; }
  .score span{ display:block; color:#9fb6e6; font:700 11px system-ui,sans-serif; letter-spacing:.16em; }
  .hint{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%); color:#7ef0e6;
    font:700 15px system-ui,sans-serif; letter-spacing:.14em; text-transform:uppercase;
    opacity:.9; transition:opacity 1s; text-align:center; }
  .hint.gone{ opacity:0; }
  .over{ position:fixed; inset:0; display:none; place-items:center; text-align:center;
    background:rgba(4,7,18,.82); color:#EAF1FF; font-family:system-ui,sans-serif; }
  .over.on{ display:grid; }
  .over h1{ font-size:clamp(2rem,7vw,3.4rem); margin:0 0 8px; }
  .over p{ color:#9fb6e6; margin:0 0 20px; font-size:1.05rem; }
  .over button{ font:700 17px system-ui,sans-serif; color:#06122b; cursor:pointer; border:none;
    padding:14px 34px; border-radius:99px; background:linear-gradient(120deg,#7FE3FF,#26C7D1); }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud"><b>ADAM'S SPACE SHOOTER</b> · v2 — the asteroid belt</div>
<div class="bars">
  <div class="bar" id="shieldBar">
    <div class="lbl"><span>SHIELD</span><span id="shieldNum">100</span></div>
    <div class="track"><div class="fill" id="shieldFill"></div></div>
  </div>
  <div class="bar" id="hullBar">
    <div class="lbl"><span>HULL</span><span id="hullNum">100</span></div>
    <div class="track"><div class="fill" id="hullFill"></div></div>
  </div>
</div>
<div class="score"><span>SCORE</span><b id="scoreNum">0</b></div>
<div class="hint" id="hint">WASD to fly · SPACE to fire plasma</div>

<div class="over" id="over">
  <div>
    <h1>The cat ship is down 🐱</h1>
    <p id="overMsg">The aliens got through. Try again!</p>
    <button id="again">Fly again</button>
  </div>
</div>

<script>
// ============================================================
//  VERSION 2 — plasma blasters + the asteroid belt + the shield
//
//  Adam's shield rules, exactly as he designed them:
//    · shield starts at 100
//    · every hit takes 5
//    · when the shield is gone, the HULL starts taking the hits
//    · COMEBACK RULE: if the hull drops to 30 or less,
//      the shield regenerates!
//
//  Still to come in v3: alien ships that shoot back, and the
//  mothership boss that deploys smaller ships.
// ============================================================
const cv = document.getElementById('game');
const g  = cv.getContext('2d');
let W, H;
function fit(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
fit(); addEventListener('resize', fit);

// ---------- the starfield (3 layers = feels deep) ----------
const stars = [];
for (let i = 0; i < 140; i++) {
  const layer = i % 3;
  stars.push({
    x: Math.random() * 2000, y: Math.random(),
    speed: [40, 90, 170][layer], size: [1.2, 1.8, 2.6][layer], glow: [0.45, 0.7, 1][layer]
  });
}

// ---------- the cat ship ----------
const ship = {
  x: 160, y: 300, vx: 0, vy: 0,
  accel: 1400, drag: 4.2, max: 420,
  shield: 100, hull: 100,
  hurtFlash: 0,        // counts down after a hit, for the red flash
  regenFlash: 0        // counts down when the comeback shield kicks in
};

let bullets = [];      // our plasma bolts
let rocks   = [];      // the asteroid belt
let bits    = [];      // little debris sparks
let score = 0;
let alive = true;
let cooldown = 0;      // stops the blaster firing every single frame
let spawnTimer = 0;

// ---------- controls: WASD + arrows, SPACE to fire ----------
const keys = {};
addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  hint.classList.add('gone');
  if (e.key === ' ') e.preventDefault();     // don't scroll the page
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// ---------- firing the plasma blasters ----------
function fire(){
  bullets.push({ x: ship.x + 40, y: ship.y - 1, vx: 900 + ship.vx * 0.35 });
  bullets.push({ x: ship.x + 40, y: ship.y + 7, vx: 900 + ship.vx * 0.35 });
  cooldown = 0.14;                            // seconds between shots
}

// ---------- asteroids ----------
function spawnRock(){
  const size = 18 + Math.random() * 34;
  const pts = [];                             // a lumpy, hand-made rock shape
  const corners = 8 + Math.floor(Math.random() * 4);
  for (let i = 0; i < corners; i++){
    const a = (i / corners) * Math.PI * 2;
    pts.push({ a, r: size * (0.72 + Math.random() * 0.42) });
  }
  rocks.push({
    x: W + size + 20,
    y: 60 + Math.random() * (H - 120),
    vx: -(110 + Math.random() * 140),
    vy: (Math.random() - 0.5) * 50,
    size, pts,
    spin: (Math.random() - 0.5) * 1.6,
    rot: Math.random() * 6.28,
    hp: size > 38 ? 3 : (size > 26 ? 2 : 1)
  });
}

// ---------- taking damage — ADAM'S SHIELD RULES ----------
function damage(amount){
  if (!alive) return;
  ship.hurtFlash = 0.3;
  if (ship.shield > 0){
    ship.shield = Math.max(0, ship.shield - amount);     // shield eats it first
  } else {
    ship.hull = Math.max(0, ship.hull - amount);         // then the hull takes hits
    // THE COMEBACK RULE: hull at 30 or less → the shield comes back!
    if (ship.hull <= 30 && ship.hull > 0){
      ship.shield = 100;
      ship.regenFlash = 1.2;
    }
  }
  if (ship.hull <= 0) gameOver();
}

function gameOver(){
  alive = false;
  document.getElementById('overMsg').textContent =
    'You scored ' + score + ' before the belt got you. The cloned Earth is still out there…';
  document.getElementById('over').classList.add('on');
}

function restart(){
  ship.x = 160; ship.y = H/2; ship.vx = ship.vy = 0;
  ship.shield = 100; ship.hull = 100; ship.hurtFlash = ship.regenFlash = 0;
  bullets = []; rocks = []; bits = [];
  score = 0; alive = true; spawnTimer = 0;
  document.getElementById('over').classList.remove('on');
}
document.getElementById('again').onclick = restart;

// ---------- little explosion sparks ----------
function boom(x, y, n, color){
  for (let i = 0; i < n; i++){
    const a = Math.random() * 6.28, s = 40 + Math.random() * 240;
    bits.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.5 + Math.random()*0.4, color });
  }
}

// ---------- draw the cat ship (our hero!) ----------
function drawShip(t){
  const tilt = ship.vy / ship.max * 0.35;
  const bob  = Math.sin(t * 3) * 2;
  g.save();
  g.translate(ship.x, ship.y + bob);
  g.rotate(tilt);

  // the shield bubble — only visible while the shield is up
  if (ship.shield > 0){
    const pulse = 0.5 + 0.5 * Math.sin(t * 4);
    g.strokeStyle = 'rgba(38,199,209,' + (0.25 + 0.35 * (ship.shield/100) + pulse*0.12) + ')';
    g.lineWidth = 2.5;
    g.beginPath(); g.ellipse(0, 0, 52, 38, 0, 0, Math.PI * 2); g.stroke();
    if (ship.regenFlash > 0){                    // bright ring when it comes back
      g.strokeStyle = 'rgba(155,245,199,' + ship.regenFlash + ')';
      g.lineWidth = 5;
      g.beginPath(); g.ellipse(0, 0, 56 + (1.2-ship.regenFlash)*22, 42 + (1.2-ship.regenFlash)*16, 0, 0, 6.28); g.stroke();
    }
  }

  // thruster flame
  const thrust = 14 + Math.random() * 10 + Math.max(0, ship.vx) * 0.05;
  const flame = g.createLinearGradient(-38 - thrust, 0, -30, 0);
  flame.addColorStop(0, 'rgba(255,179,32,0)');
  flame.addColorStop(0.6, '#FFB320');
  flame.addColorStop(1, '#7FE3FF');
  g.fillStyle = flame;
  g.beginPath(); g.moveTo(-30, -7); g.lineTo(-38 - thrust, 0); g.lineTo(-30, 7); g.closePath(); g.fill();

  // body — flashes red the moment you take a hit
  g.fillStyle = ship.hurtFlash > 0 ? '#FF7452' : '#EAF1FF';
  g.beginPath(); g.ellipse(0, 0, 34, 20, 0, 0, Math.PI * 2); g.fill();

  // cat ears
  g.beginPath();
  g.moveTo(6, -16);  g.lineTo(13, -30); g.lineTo(21, -14);
  g.moveTo(-8, -17); g.lineTo(-3, -30); g.lineTo(6, -16);
  g.closePath(); g.fill();
  g.fillStyle = '#FF6FB5';
  g.beginPath();
  g.moveTo(9, -17);  g.lineTo(13, -25); g.lineTo(18, -15);
  g.moveTo(-5, -18); g.lineTo(-2, -25); g.lineTo(3, -17);
  g.closePath(); g.fill();

  // cockpit
  g.fillStyle = '#26C7D1';
  g.beginPath(); g.ellipse(10, -3, 13, 9, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = 'rgba(255,255,255,.55)';
  g.beginPath(); g.ellipse(14, -6, 4, 2.5, 0, 0, Math.PI * 2); g.fill();

  // whiskers
  g.strokeStyle = 'rgba(234,241,255,.8)'; g.lineWidth = 1.5;
  g.beginPath();
  g.moveTo(30, -2); g.lineTo(42, -5);
  g.moveTo(30,  2); g.lineTo(42,  2);
  g.moveTo(30,  6); g.lineTo(42,  9);
  g.stroke();

  // tail
  g.strokeStyle = ship.hurtFlash > 0 ? '#FF7452' : '#EAF1FF';
  g.lineWidth = 5; g.lineCap = 'round';
  g.beginPath(); g.moveTo(-28, 8); g.quadraticCurveTo(-44, 14, -40, 0); g.stroke();

  g.restore();
}

// ---------- the game loop ----------
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const t = now / 1000;

  if (alive){
    // --- move the ship ---
    let ax = 0, ay = 0;
    if (keys['a'] || keys['arrowleft'])  ax -= 1;
    if (keys['d'] || keys['arrowright']) ax += 1;
    if (keys['w'] || keys['arrowup'])    ay -= 1;
    if (keys['s'] || keys['arrowdown'])  ay += 1;
    ship.vx += ax * ship.accel * dt;
    ship.vy += ay * ship.accel * dt;
    ship.vx -= ship.vx * ship.drag * dt;
    ship.vy -= ship.vy * ship.drag * dt;
    ship.vx = Math.max(-ship.max, Math.min(ship.max, ship.vx));
    ship.vy = Math.max(-ship.max, Math.min(ship.max, ship.vy));
    ship.x += ship.vx * dt;  ship.y += ship.vy * dt;
    ship.x = Math.max(50, Math.min(W - 50, ship.x));
    ship.y = Math.max(44, Math.min(H - 40, ship.y));

    // --- fire the plasma blasters ---
    cooldown -= dt;
    if ((keys[' '] || keys['spacebar']) && cooldown <= 0) fire();

    // --- spawn asteroids, faster as your score climbs ---
    spawnTimer -= dt;
    if (spawnTimer <= 0){
      spawnRock();
      spawnTimer = Math.max(0.3, 1.0 - score / 4000);
    }
  }

  ship.hurtFlash = Math.max(0, ship.hurtFlash - dt);
  ship.regenFlash = Math.max(0, ship.regenFlash - dt);

  // --- move bullets ---
  for (const b of bullets) b.x += b.vx * dt;
  bullets = bullets.filter(b => b.x < W + 30);

  // --- move asteroids ---
  for (const r of rocks){
    r.x += r.vx * dt; r.y += r.vy * dt; r.rot += r.spin * dt;
    if (r.y < r.size) r.vy = Math.abs(r.vy);            // bounce off the top
    if (r.y > H - r.size) r.vy = -Math.abs(r.vy);       // and the bottom
  }
  rocks = rocks.filter(r => r.x > -r.size - 40);

  // --- bullets vs asteroids ---
  for (const b of bullets){
    for (const r of rocks){
      const dx = b.x - r.x, dy = b.y - r.y;
      if (dx*dx + dy*dy < r.size * r.size){
        b.dead = true; r.hp -= 1;
        boom(b.x, b.y, 6, '#7FE3FF');
        if (r.hp <= 0){
          r.dead = true;
          score += Math.round(r.size);                  // bigger rock, bigger score
          boom(r.x, r.y, 18, '#FFB320');
        }
        break;
      }
    }
  }
  bullets = bullets.filter(b => !b.dead);
  rocks   = rocks.filter(r => !r.dead);

  // --- asteroids vs the cat ship ---
  if (alive){
    for (const r of rocks){
      const dx = ship.x - r.x, dy = ship.y - r.y;
      const reach = r.size + 24;
      if (dx*dx + dy*dy < reach * reach){
        r.dead = true;
        boom(r.x, r.y, 16, '#FF7452');
        damage(5);                                      // Adam's rule: 5 per hit
      }
    }
    rocks = rocks.filter(r => !r.dead);
  }

  // --- debris sparks ---
  for (const p of bits){ p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt; }
  bits = bits.filter(p => p.life > 0);

  // ================= DRAW =================
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#0B1030'); sky.addColorStop(0.6, '#070C1F'); sky.addColorStop(1, '#04060F');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);

  for (const s of stars){
    if (alive) s.x -= s.speed * dt;
    if (s.x < -10) s.x = W + 10;
    g.globalAlpha = s.glow * (0.6 + 0.4 * Math.sin(t * 2 + s.y * 40));
    g.fillStyle = '#EAF1FF';
    g.fillRect(s.x, s.y * H, s.size * (1 + s.speed / 200), s.size);
  }
  g.globalAlpha = 1;

  // asteroids
  for (const r of rocks){
    g.save(); g.translate(r.x, r.y); g.rotate(r.rot);
    g.beginPath();
    r.pts.forEach((p, i) => {
      const px = Math.cos(p.a) * p.r, py = Math.sin(p.a) * p.r;
      i ? g.lineTo(px, py) : g.moveTo(px, py);
    });
    g.closePath();
    g.fillStyle = '#5a5f78'; g.fill();
    g.strokeStyle = '#8c93b0'; g.lineWidth = 2; g.stroke();
    g.fillStyle = 'rgba(255,255,255,.10)';                 // a little crater
    g.beginPath(); g.arc(-r.size*0.22, -r.size*0.18, r.size*0.24, 0, 6.28); g.fill();
    g.restore();
  }

  // plasma bolts
  for (const b of bullets){
    const grad = g.createLinearGradient(b.x - 22, 0, b.x + 6, 0);
    grad.addColorStop(0, 'rgba(127,227,255,0)');
    grad.addColorStop(1, '#7FE3FF');
    g.fillStyle = grad;
    g.fillRect(b.x - 22, b.y - 2, 28, 4);
    g.fillStyle = '#fff';
    g.fillRect(b.x + 1, b.y - 1.5, 6, 3);
  }

  // sparks
  for (const p of bits){
    g.globalAlpha = Math.max(0, p.life * 1.6);
    g.fillStyle = p.color;
    g.fillRect(p.x, p.y, 3, 3);
  }
  g.globalAlpha = 1;

  if (alive) drawShip(t);

  // ---- HUD numbers ----
  document.getElementById('shieldFill').style.width = ship.shield + '%';
  document.getElementById('hullFill').style.width   = ship.hull + '%';
  document.getElementById('shieldNum').textContent  = Math.round(ship.shield);
  document.getElementById('hullNum').textContent    = Math.round(ship.hull);
  document.getElementById('scoreNum').textContent   = score;
  document.getElementById('shieldBar').classList.toggle('regen', ship.regenFlash > 0);

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// handy for poking at the game in the console (and for testing)
window.game = { ship, get rocks(){return rocks;}, get bullets(){return bullets;},
                get score(){return score;}, damage, spawnRock, restart };
</script>
</body>
</html>
