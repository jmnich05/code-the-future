<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adam's Space Shooter — v5</title>
<style>
  /* Adam's game. v5: THE GRADIUS UPGRADE — same game, way bigger lights.
     Mechanics and story are UNCHANGED from v4. This is a graphics pass. */
  html,body{ margin:0; height:100%; background:#02030a; overflow:hidden; }
  canvas{ display:block; width:100vw; height:100vh; }
  .hud{ position:fixed; left:14px; top:12px; max-width:52vw; color:#9fb6e6;
    font:600 13px system-ui,sans-serif; letter-spacing:.06em; text-shadow:0 0 6px rgba(38,199,209,.6); }
  .hud b{ color:#fff; }
  .bars{ position:fixed; left:14px; top:46px; width:min(220px,44vw); font:700 11px system-ui,sans-serif; letter-spacing:.1em; }
  .bar{ margin-bottom:7px; }
  .bar .lbl{ display:flex; justify-content:space-between; color:#9fb6e6; margin-bottom:3px; }
  .bar .track{ height:11px; border-radius:99px; background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.18); overflow:hidden; }
  .bar .fill{ height:100%; width:100%; border-radius:99px; transition:width .18s; }
  #shieldFill{ background:linear-gradient(90deg,#26C7D1,#7FE3FF); box-shadow:0 0 8px #26C7D1; }
  #hullFill{ background:linear-gradient(90deg,#FFB320,#FF7452); box-shadow:0 0 8px #FFB320; }
  .bar.regen .lbl{ color:#9BF5C7; }
  .score{ position:fixed; right:16px; top:12px; text-align:right;
    color:#fff; font:800 26px 'Courier New',monospace; letter-spacing:.1em; text-shadow:0 0 10px rgba(127,227,255,.8); }
  .score span{ display:block; color:#9fb6e6; font:700 11px system-ui,sans-serif; letter-spacing:.16em; }
  #wave{ position:fixed; right:16px; top:64px; text-align:right; color:#7ef0e6;
    font:700 12px system-ui,sans-serif; letter-spacing:.14em; text-shadow:0 0 8px rgba(126,240,230,.7); }
  .hint{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%); color:#7ef0e6;
    font:700 15px system-ui,sans-serif; letter-spacing:.14em; text-transform:uppercase;
    opacity:.9; transition:opacity 1s; text-align:center; text-shadow:0 0 10px rgba(126,240,230,.8); }
  .hint.gone{ opacity:0; }
  .bossbar{ position:fixed; left:50%; top:14px; transform:translateX(-50%);
    width:min(420px,60vw); display:none; font:800 12px system-ui,sans-serif;
    color:#FF9CB0; letter-spacing:.2em; text-align:center; text-shadow:0 0 10px rgba(255,92,122,.8); }
  .bossbar.on{ display:block; }
  .bossbar .track{ margin-top:4px; height:12px; border-radius:99px;
    background:rgba(255,255,255,.09); border:1px solid rgba(255,92,122,.5); overflow:hidden; }
  .bossbar .fill{ height:100%; width:100%; background:linear-gradient(90deg,#FF3B5C,#FF9CB0); border-radius:99px; transition:width .15s; box-shadow:0 0 10px #FF3B5C; }
  .over{ position:fixed; inset:0; display:none; place-items:center; text-align:center;
    background:rgba(2,3,10,.85); color:#EAF1FF; font-family:system-ui,sans-serif; }
  .over.on{ display:grid; }
  .over h1{ font-size:clamp(2rem,7vw,3.4rem); margin:0 0 8px; text-shadow:0 0 20px rgba(127,227,255,.6); }
  .over p{ color:#9fb6e6; margin:0 0 20px; font-size:1.05rem; }
  .over button{ font:700 17px system-ui,sans-serif; color:#06122b; cursor:pointer; border:none;
    padding:14px 34px; border-radius:99px; background:linear-gradient(120deg,#7FE3FF,#26C7D1); box-shadow:0 0 24px rgba(38,199,209,.6); }
  #mode{ position:fixed; right:16px; bottom:14px; color:#44507a; font:700 10px system-ui,sans-serif; letter-spacing:.16em; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud"><b>ADAM'S SPACE SHOOTER</b> · v5 — approach to the cloned Earth</div>
<div class="bars">
  <div class="bar" id="shieldBar">
    <div class="lbl"><span>SHIELD</span><span id="shieldNum">100</span></div>
    <div class="track"><div class="fill" id="shieldFill"></div></div>
  </div>
  <div class="bar" id="hullBar">
    <div class="lbl"><span>HULL</span><span id="hullNum">100</span></div>
    <div class="track"><div class="fill" id="hullFill"></div></div>
  </div>
</div>
<div class="score"><span>SCORE</span><b id="scoreNum">0</b></div>
<div id="wave">WAVE 1</div>
<div class="bossbar" id="bossbar">👾 MOTHERSHIP<div class="track"><div class="fill" id="bossFill"></div></div></div>
<div class="hint" id="hint">WASD to fly · SPACE fires plasma · M for sound</div>

<div class="over" id="over">
  <div>
    <h1>The cat ship is down 🐱</h1>
    <p id="overMsg">The aliens got through. Try again!</p>
    <button id="again">Fly again</button>
  </div>
</div>
<div id="mode"></div>

<script>
// ============================================================
//  VERSION 5 — THE GRADIUS UPGRADE (graphics only!)
//
//  Adam's rules — UNCHANGED, exactly as he designed them:
//    · shield 100 · every hit takes 5 · shield gone → hull
//    · COMEBACK RULE: hull ≤ 30 → shield regenerates
//    · slow self-repair (v3) · plasma cooldown (v3)
//    · saucers that shoot back + the mothership (v4)
//
//  New in v5 — the LOOK, inspired by Gradius V:
//    · the cloned Earth hangs huge in the background
//    · nebula skies in green and violet, layered star drift
//    · plasma is now a BEAM: white core, cyan bloom, muzzle flash
//    · metallic hulls, engine glow, banking animation
//    · staged explosions: flash → fireball → shockwave ring
//
//  ONE FILE, TWO MODES (leave this switch alone, future builders!):
//    iframe preview → LITE · full screen/published → DELUXE
// ============================================================
const params = new URLSearchParams(location.search);
const DELUXE = params.get('mode') === 'lite' ? false
             : params.get('mode') === 'full' ? true
             : (window.self === window.top);
document.getElementById('mode').textContent = DELUXE ? 'DELUXE MODE' : 'PREVIEW MODE';

const cv = document.getElementById('game');
const g  = cv.getContext('2d');
let W, H;
function fit(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
fit(); addEventListener('resize', fit);

// ---------- sound ----------
let AC = null, soundOn = DELUXE;
function beep(freq, dur, type, vol, slide){
  if (!soundOn) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), v = AC.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), AC.currentTime + dur);
    v.gain.value = vol || 0.04;
    v.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.connect(v); v.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur);
  }catch(e){}
}
const sfx = {
  fire : () => beep(620, 0.09, 'square',  0.03, -300),
  hit  : () => beep(180, 0.15, 'sawtooth',0.05, -80),
  boom : () => beep(90,  0.3,  'sawtooth',0.07, -60),
  alien: () => beep(300, 0.12, 'triangle',0.04, 140),
  regen: () => { beep(440,0.12,'sine',0.05,220); setTimeout(()=>beep(660,0.18,'sine',0.05,220),110); },
  boss : () => { beep(70,0.5,'sawtooth',0.08,-20); setTimeout(()=>beep(55,0.6,'sawtooth',0.08,-15),240); }
};

// ---------- starfield + nebulae + THE CLONED EARTH ----------
const STAR_N = DELUXE ? 340 : 130;
const stars = [];
for (let i = 0; i < STAR_N; i++) {
  const layer = i % 3;
  stars.push({
    x: Math.random() * 2400, y: Math.random(),
    speed: [40, 90, 175][layer], size: [1.1, 1.7, 2.5][layer], glow: [0.4, 0.65, 1][layer],
    hue: Math.random() < .8 ? null : (Math.random() < .5 ? '#ffd8a8' : '#a8c8ff')
  });
}
// Gradius skies: big soft clouds of green and violet
const nebulae = [];
const NEB_N = DELUXE ? 7 : 3;
for (let i = 0; i < NEB_N; i++) nebulae.push({
  x: Math.random()*2600, y: Math.random(), r: 220 + Math.random()*330,
  hue: [110, 285, 160, 320][i % 4], speed: 9 + Math.random()*13, a: .1 + Math.random()*.08
});
// slow drifting dust streaks (deluxe)
const dust = [];
if (DELUXE) for (let i = 0; i < 40; i++) dust.push({x:Math.random()*2200,y:Math.random(),len:30+Math.random()*80,sp:220+Math.random()*160});

// pre-render the cloned Earth once — it's expensive to gradient every frame
function bakeEarth(r){
  const c = document.createElement('canvas'); c.width = c.height = r*2+40;
  const x2 = c.getContext('2d'), cx = r+20, cyy = r+20;
  // ocean ball — deep and dark, so the game's lights stay the brightest thing
  const oc = x2.createRadialGradient(cx-r*.4, cyy-r*.45, r*.1, cx, cyy, r);
  oc.addColorStop(0,'#4a86c8'); oc.addColorStop(.4,'#1d4478'); oc.addColorStop(.8,'#0a2148'); oc.addColorStop(1,'#040d22');
  x2.fillStyle = oc; x2.beginPath(); x2.arc(cx,cyy,r,0,6.28); x2.fill();
  // continents — many small ragged islands, clipped to the ball
  x2.save();
  x2.beginPath(); x2.arc(cx,cyy,r,0,6.28); x2.clip();
  const blob=(bx,by,s,n,seed)=>{x2.beginPath();for(let i=0;i<=n;i++){const a=i/n*6.28,rr=s*(.45+((i*7919+seed)%100)/110);const px=cx+bx+Math.cos(a)*rr,py=cyy+by+Math.sin(a)*rr*.62;i?x2.lineTo(px,py):x2.moveTo(px,py)}x2.closePath();x2.fill()};
  x2.fillStyle = 'rgba(58,96,54,.85)';
  for(let i=0;i<11;i++){const a=i*2.39996,d=r*(.15+((i*37)%70)/100);blob(Math.cos(a)*d,Math.sin(a)*d,r*(.1+((i*53)%14)/100),9,i*131)}
  x2.fillStyle = 'rgba(92,120,74,.45)';
  for(let i=0;i<8;i++){const a=i*2.1+0.9,d=r*(.3+((i*29)%55)/100);blob(Math.cos(a)*d,Math.sin(a)*d,r*.06,7,i*577)}
  // clouds — thin wind-blown streaks with an ABSOLUTE size cap, so a bigger
  // planet never means bigger clouds
  x2.fillStyle = 'rgba(255,255,255,.3)';
  for(let i=0;i<46;i++){
    const a=i*0.83,d=r*((i*17%92)/100);
    const sx=cx+Math.cos(a)*d, sy=cyy+Math.sin(a)*d;
    const cw=Math.min(24, r*.06+((i*7)%10)), ch=Math.min(4, r*.012+1);
    x2.save(); x2.translate(sx,sy); x2.rotate(-.5+((i*13)%20)/20);
    x2.beginPath(); x2.ellipse(0,0,cw,ch,0,0,6.28); x2.fill();
    x2.restore();
  }
  x2.restore();
  // atmosphere rim
  x2.globalCompositeOperation='lighter';
  const rim = x2.createRadialGradient(cx,cyy,r*.92,cx,cyy,r*1.08);
  rim.addColorStop(0,'rgba(120,200,255,0)'); rim.addColorStop(.7,'rgba(120,200,255,.5)'); rim.addColorStop(1,'rgba(120,200,255,0)');
  x2.fillStyle=rim; x2.beginPath(); x2.arc(cx,cyy,r*1.08,0,6.28); x2.fill();
  // day-side glow
  const glow = x2.createRadialGradient(cx-r*.5,cyy-r*.5,0,cx-r*.5,cyy-r*.5,r*.9);
  glow.addColorStop(0,'rgba(200,240,255,.35)'); glow.addColorStop(1,'rgba(200,240,255,0)');
  x2.fillStyle=glow; x2.beginPath(); x2.arc(cx,cyy,r,0,6.28); x2.fill();
  return c;
}
// The destination hangs in the upper distance — present, dark, never in the way.
const EARTH = bakeEarth(DELUXE ? 240 : 170);

// ---------- the cat ship (mechanics identical to v4) ----------
const ship = {
  x: 160, y: 300, vx: 0, vy: 0,
  accel: 1400, drag: 4.2, max: 420,
  shield: 100, hull: 100,
  hurtFlash: 0, regenFlash: 0
};

let bullets = [];
let ebullets = [];
let rocks   = [];
let aliens  = [];
let boss    = null;
let bits    = [];      // spark particles
let rings   = [];      // shockwave rings (new, pure looks)
let trail   = [];      // engine trail particles (new, pure looks)
let score = 0, wave = 1, nextBossAt = 900;
let alive = true;
let cooldown = 0, spawnTimer = 0, alienTimer = 6;
let shake = 0;

// ---------- controls ----------
const keys = {};
addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  hint.classList.add('gone');
  if (e.key === ' ') e.preventDefault();
  if (e.key.toLowerCase() === 'm'){ soundOn = !soundOn; }
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
let touching = false;
cv.addEventListener('touchstart', e => { touching = true; hint.classList.add('gone'); }, {passive:true});
cv.addEventListener('touchend',   () => { touching = false; });
cv.addEventListener('touchmove', e => {
  const t = e.touches[0];
  ship.x += (t.clientX - ship.x) * 0.25;
  ship.y += (t.clientY - ship.y) * 0.25;
}, {passive:true});

// ---------- firing (same cooldown rule; the BEAM is only looks) ----------
let muzzle = 0;
function fire(){
  bullets.push({ x: ship.x + 40, y: ship.y - 1, vx: 900 + ship.vx * 0.35 });
  bullets.push({ x: ship.x + 40, y: ship.y + 7, vx: 900 + ship.vx * 0.35 });
  cooldown = 0.28;
  muzzle = 0.09;
  sfx.fire();
}

// ---------- asteroids ----------
function spawnRock(){
  const size = 18 + Math.random() * 34;
  const pts = [];
  const corners = 8 + Math.floor(Math.random() * 4);
  for (let i = 0; i < corners; i++){
    const a = (i / corners) * Math.PI * 2;
    pts.push({ a, r: size * (0.72 + Math.random() * 0.42) });
  }
  rocks.push({
    x: W + size + 20,
    y: 60 + Math.random() * (H - 120),
    vx: -(110 + Math.random() * 140) - wave * 8,
    vy: (Math.random() - 0.5) * 50,
    size, pts,
    spin: (Math.random() - 0.5) * 1.6,
    rot: Math.random() * 6.28,
    hp: size > 38 ? 3 : (size > 26 ? 2 : 1)
  });
}

// ---------- saucers ----------
function spawnAlien(fromBoss){
  aliens.push({
    x: fromBoss ? boss.x - 40 : W + 50,
    y: fromBoss ? boss.y : 80 + Math.random() * (H - 160),
    vx: -(90 + Math.random() * 60) - wave * 6,
    wob: Math.random() * 6.28,
    hp: 2, gun: 1.2 + Math.random() * 1.4, flash: 0
  });
  if (fromBoss) sfx.alien();
}

// ---------- the mothership ----------
function spawnBoss(){
  boss = {
    x: W + 200, y: H / 2, vy: 60,
    hp: 28 + wave * 6, maxHp: 28 + wave * 6,
    gun: 2, deploy: 3.2, flash: 0, entering: true
  };
  document.getElementById('bossbar').classList.add('on');
  sfx.boss();
}

// ---------- damage — ADAM'S SHIELD RULES (unchanged) ----------
function damage(amount){
  if (!alive) return;
  ship.hurtFlash = 0.3;
  shake = Math.min(14, shake + 6);
  sfx.hit();
  if (ship.shield > 0){
    ship.shield = Math.max(0, ship.shield - amount);
  } else {
    ship.hull = Math.max(0, ship.hull - amount);
    if (ship.hull <= 30 && ship.hull > 0){
      ship.shield = 100;                       // THE COMEBACK RULE
      ship.regenFlash = 1.2;
      sfx.regen();
    }
  }
  if (ship.hull <= 0) gameOver();
}

function gameOver(){
  alive = false;
  bigBoom(ship.x, ship.y, 2);
  document.getElementById('overMsg').textContent =
    'You scored ' + score + ' and made it to wave ' + wave + '. The cloned Earth is still out there…';
  document.getElementById('over').classList.add('on');
}

function restart(){
  ship.x = 160; ship.y = H/2; ship.vx = ship.vy = 0;
  ship.shield = 100; ship.hull = 100; ship.hurtFlash = ship.regenFlash = 0;
  bullets = []; ebullets = []; rocks = []; aliens = []; bits = []; rings = []; trail = []; boss = null;
  score = 0; wave = 1; nextBossAt = 900; alive = true; spawnTimer = 0; alienTimer = 6;
  document.getElementById('bossbar').classList.remove('on');
  document.getElementById('over').classList.remove('on');
}
document.getElementById('again').onclick = restart;

// ---------- explosions: flash → fireball → shockwave ----------
const SPARK_MULT = DELUXE ? 1.8 : 0.7;
function boom(x, y, n, color){
  n = Math.round(n * SPARK_MULT);
  for (let i = 0; i < n; i++){
    const a = Math.random() * 6.28, s = 40 + Math.random() * 260;
    bits.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.5 + Math.random()*0.5, color,
                sz: 2 + Math.random()*3 });
  }
  rings.push({ x, y, r: 4, max: 46 + n, life: 1 });
}
function bigBoom(x, y, scale){
  boom(x, y, 40*scale, '#FFB320');
  boom(x, y, 26*scale, '#FF7452');
  boom(x, y, 18*scale, '#7FE3FF');
  rings.push({ x, y, r: 10, max: 130*scale, life: 1 });
  shake = Math.min(22, shake + 10*scale);
}

// ============================================================
//  DRAWING — the Gradius pass
// ============================================================
function drawShip(t){
  const tilt = ship.vy / ship.max * 0.4;         // banks harder now
  const bob  = Math.sin(t * 3) * 2;
  // engine trail — glowing particles streaming behind
  trail.push({ x: ship.x - 34, y: ship.y + bob + (Math.random()-0.5)*6, life: .5, sz: 3+Math.random()*3 });

  g.save();
  g.translate(ship.x, ship.y + bob);
  g.rotate(tilt);

  // shield bubble with bloom
  if (ship.shield > 0){
    const pulse = 0.5 + 0.5 * Math.sin(t * 4);
    g.save(); g.globalCompositeOperation = 'lighter';
    g.strokeStyle = 'rgba(38,199,209,' + (0.25 + 0.35 * (ship.shield/100) + pulse*0.12) + ')';
    g.lineWidth = 2.5;
    g.beginPath(); g.ellipse(0, 0, 52, 38, 0, 0, Math.PI * 2); g.stroke();
    g.strokeStyle = 'rgba(127,227,255,' + (0.12 + pulse*0.08) + ')';
    g.lineWidth = 7;
    g.beginPath(); g.ellipse(0, 0, 52, 38, 0, 0, Math.PI * 2); g.stroke();
    if (ship.regenFlash > 0){
      g.strokeStyle = 'rgba(155,245,199,' + ship.regenFlash + ')';
      g.lineWidth = 5;
      g.beginPath(); g.ellipse(0, 0, 56 + (1.2-ship.regenFlash)*22, 42 + (1.2-ship.regenFlash)*16, 0, 0, 6.28); g.stroke();
    }
    g.restore();
  }

  // engine core glow (the Gradius blue heart)
  g.save(); g.globalCompositeOperation = 'lighter';
  const core = g.createRadialGradient(-30, 0, 0, -30, 0, 16);
  core.addColorStop(0, 'rgba(200,245,255,.9)');
  core.addColorStop(.4, 'rgba(127,227,255,.55)');
  core.addColorStop(1, 'rgba(127,227,255,0)');
  g.fillStyle = core; g.beginPath(); g.arc(-30, 0, 16, 0, 6.28); g.fill();
  g.restore();

  // thruster flame
  const thrust = 16 + Math.random() * 12 + Math.max(0, ship.vx) * 0.05;
  const flame = g.createLinearGradient(-40 - thrust, 0, -30, 0);
  flame.addColorStop(0, 'rgba(255,179,32,0)');
  flame.addColorStop(0.55, '#FFB320');
  flame.addColorStop(1, '#7FE3FF');
  g.fillStyle = flame;
  g.beginPath(); g.moveTo(-30, -7); g.lineTo(-40 - thrust, 0); g.lineTo(-30, 7); g.closePath(); g.fill();

  // hull — metallic gradient now, same cat silhouette
  const hull = g.createLinearGradient(0, -20, 0, 20);
  if (ship.hurtFlash > 0){ hull.addColorStop(0,'#FF9C86'); hull.addColorStop(1,'#D14A2E'); }
  else { hull.addColorStop(0, '#FDFEFF'); hull.addColorStop(.45, '#D9E4F2'); hull.addColorStop(.55, '#B7C6DC'); hull.addColorStop(1, '#8FA2BE'); }
  g.fillStyle = hull;
  g.beginPath(); g.ellipse(0, 0, 34, 20, 0, 0, Math.PI * 2); g.fill();
  // panel lines
  g.strokeStyle = 'rgba(90,110,140,.5)'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(-18,-12); g.quadraticCurveTo(0,-16,20,-8); g.stroke();
  g.beginPath(); g.moveTo(-22,8); g.quadraticCurveTo(-2,14,18,10); g.stroke();
  // red racing stripe (every good ship has one)
  g.strokeStyle = '#E8563F'; g.lineWidth = 2.5;
  g.beginPath(); g.moveTo(-26,-4); g.quadraticCurveTo(0,-9,26,-2); g.stroke();

  // cat ears (metal now)
  g.fillStyle = ship.hurtFlash > 0 ? '#FF9C86' : '#D9E4F2';
  g.beginPath();
  g.moveTo(6, -16);  g.lineTo(13, -30); g.lineTo(21, -14);
  g.moveTo(-8, -17); g.lineTo(-3, -30); g.lineTo(6, -16);
  g.closePath(); g.fill();
  g.fillStyle = '#FF6FB5';
  g.beginPath();
  g.moveTo(9, -17);  g.lineTo(13, -25); g.lineTo(18, -15);
  g.moveTo(-5, -18); g.lineTo(-2, -25); g.lineTo(3, -17);
  g.closePath(); g.fill();

  // cockpit with inner light
  const cock = g.createRadialGradient(12,-6,1,10,-3,14);
  cock.addColorStop(0,'#CFF6FF'); cock.addColorStop(.5,'#26C7D1'); cock.addColorStop(1,'#117884');
  g.fillStyle = cock;
  g.beginPath(); g.ellipse(10, -3, 13, 9, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = 'rgba(255,255,255,.7)';
  g.beginPath(); g.ellipse(14, -6, 4, 2.5, 0, 0, Math.PI * 2); g.fill();

  // whiskers
  g.strokeStyle = 'rgba(234,241,255,.8)'; g.lineWidth = 1.5;
  g.beginPath();
  g.moveTo(30, -2); g.lineTo(42, -5);
  g.moveTo(30,  2); g.lineTo(42,  2);
  g.moveTo(30,  6); g.lineTo(42,  9);
  g.stroke();

  // tail
  g.strokeStyle = ship.hurtFlash > 0 ? '#FF9C86' : '#D9E4F2';
  g.lineWidth = 5; g.lineCap = 'round';
  g.beginPath(); g.moveTo(-28, 8); g.quadraticCurveTo(-44, 14, -40, 0); g.stroke();

  // muzzle flash when the beam fires
  if (muzzle > 0){
    g.save(); g.globalCompositeOperation = 'lighter';
    const mf = g.createRadialGradient(44, 2, 0, 44, 2, 26);
    mf.addColorStop(0, 'rgba(255,255,255,' + muzzle*9 + ')');
    mf.addColorStop(.5, 'rgba(127,227,255,' + muzzle*6 + ')');
    mf.addColorStop(1, 'rgba(127,227,255,0)');
    g.fillStyle = mf; g.beginPath(); g.arc(44, 2, 26, 0, 6.28); g.fill();
    g.restore();
  }
  g.restore();
}

function drawAlien(a, t){
  g.save(); g.translate(a.x, a.y + Math.sin(a.wob + t*3) * 8);
  // saucer body — metallic
  const bd = g.createLinearGradient(0,-8,0,12);
  bd.addColorStop(0, a.flash>0 ? '#fff' : '#C9BAF5');
  bd.addColorStop(1, a.flash>0 ? '#fff' : '#6B54A8');
  g.fillStyle = bd;
  g.beginPath(); g.ellipse(0, 2, 24, 9, 0, 0, 6.28); g.fill();
  g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 1;
  g.beginPath(); g.ellipse(0, 0, 22, 6, 0, 0, 6.28); g.stroke();
  // dome
  const dm = g.createLinearGradient(0,-16,0,2);
  dm.addColorStop(0, a.flash>0 ? '#fff' : '#B8F5D5');
  dm.addColorStop(1, a.flash>0 ? '#fff' : '#4FA87A');
  g.fillStyle = dm;
  g.beginPath(); g.ellipse(0, -6, 12, 9, 0, Math.PI, 0); g.closePath(); g.fill();
  g.fillStyle = '#0A1024';
  g.beginPath(); g.arc(-3, -7, 2.6, 0, 6.28); g.arc(5, -7, 2.6, 0, 6.28); g.fill();
  // running lights, now with glow
  g.save(); g.globalCompositeOperation = 'lighter';
  const blink = Math.sin(t * 6 + a.wob) > 0;
  for (let i = -1; i <= 1; i++){
    const col = blink ? '255,228,94' : '255,92,122';
    const lg = g.createRadialGradient(i*13, 4, 0, i*13, 4, 7);
    lg.addColorStop(0, 'rgba('+col+',.95)'); lg.addColorStop(1, 'rgba('+col+',0)');
    g.fillStyle = lg; g.beginPath(); g.arc(i * 13, 4, 7, 0, 6.28); g.fill();
  }
  g.restore();
  g.restore();
}

function drawBoss(t){
  const b = boss;
  g.save(); g.translate(b.x, b.y + Math.sin(t*1.4)*10);
  // layered armored hull — big, plated, Gradius-boss shaped
  const armor = g.createLinearGradient(0,-46,0,46);
  if (b.flash > 0){ armor.addColorStop(0,'#fff'); armor.addColorStop(1,'#fff'); }
  else { armor.addColorStop(0,'#8B7FB8'); armor.addColorStop(.5,'#584A85'); armor.addColorStop(1,'#2E2450'); }
  g.fillStyle = armor;
  g.beginPath(); g.ellipse(0, 0, 116, 44, 0, 0, 6.28); g.fill();
  // plating lines
  g.strokeStyle = 'rgba(200,190,255,.28)'; g.lineWidth = 2;
  for (let i=-2;i<=2;i++){ g.beginPath(); g.ellipse(0, 0, 116-Math.abs(i)*18, 44-Math.abs(i)*7, 0, Math.PI*1.1, Math.PI*1.9); g.stroke(); }
  // upper command dome
  const dome = g.createLinearGradient(0,-52,0,-8);
  dome.addColorStop(0, b.flash>0?'#fff':'#B9A2FF'); dome.addColorStop(1, b.flash>0?'#fff':'#6a4a9e');
  g.fillStyle = dome;
  g.beginPath(); g.ellipse(0, -24, 54, 30, 0, Math.PI, 0); g.closePath(); g.fill();
  // THE CORE — big glowing blue heart, straight from the reference
  g.save(); g.globalCompositeOperation = 'lighter';
  const pulse = .75 + .25*Math.sin(t*5);
  const coreG = g.createRadialGradient(30, 4, 0, 30, 4, 34*pulse);
  coreG.addColorStop(0, 'rgba(230,250,255,.95)');
  coreG.addColorStop(.35, 'rgba(127,227,255,.8)');
  coreG.addColorStop(.7, 'rgba(61,116,255,.4)');
  coreG.addColorStop(1, 'rgba(61,116,255,0)');
  g.fillStyle = coreG; g.beginPath(); g.arc(30, 4, 34*pulse, 0, 6.28); g.fill();
  g.restore();
  g.strokeStyle = 'rgba(220,240,255,.8)'; g.lineWidth = 2.5;
  g.beginPath(); g.arc(30, 4, 15, 0, 6.28); g.stroke();
  // gun pods with glowing tips
  for (const py of [-30, 34]){
    g.fillStyle = b.flash>0?'#fff':'#3A2F60';
    g.fillRect(-96, py-7, 34, 14);
    g.save(); g.globalCompositeOperation='lighter';
    const tip = g.createRadialGradient(-98, py, 0, -98, py, 9);
    tip.addColorStop(0,'rgba(255,92,122,.95)'); tip.addColorStop(1,'rgba(255,92,122,0)');
    g.fillStyle = tip; g.beginPath(); g.arc(-98, py, 9, 0, 6.28); g.fill();
    g.restore();
  }
  // hangar bay
  g.fillStyle = '#160E28';
  g.beginPath(); g.ellipse(-58, 14, 26, 12, 0, 0, 6.28); g.fill();
  g.strokeStyle = '#FF5C7A'; g.lineWidth = 2;
  g.beginPath(); g.ellipse(-58, 14, 26, 12, 0, 0, 6.28); g.stroke();
  g.restore();
}

// ---------- the game loop (mechanics identical to v4) ----------
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const t = now / 1000;

  if (alive){
    let ax = 0, ay = 0;
    if (keys['a'] || keys['arrowleft'])  ax -= 1;
    if (keys['d'] || keys['arrowright']) ax += 1;
    if (keys['w'] || keys['arrowup'])    ay -= 1;
    if (keys['s'] || keys['arrowdown'])  ay += 1;
    ship.vx += ax * ship.accel * dt;
    ship.vy += ay * ship.accel * dt;
    ship.vx -= ship.vx * ship.drag * dt;
    ship.vy -= ship.vy * ship.drag * dt;
    ship.vx = Math.max(-ship.max, Math.min(ship.max, ship.vx));
    ship.vy = Math.max(-ship.max, Math.min(ship.max, ship.vy));
    ship.x += ship.vx * dt;  ship.y += ship.vy * dt;
    ship.x = Math.max(50, Math.min(W - 50, ship.x));
    ship.y = Math.max(44, Math.min(H - 40, ship.y));

    ship.shield = Math.min(100, ship.shield + 8 * dt);
    ship.hull = Math.min(100, ship.hull + 3 * dt);

    cooldown -= dt;
    if ((keys[' '] || keys['spacebar'] || touching) && cooldown <= 0) fire();

    spawnTimer -= dt;
    if (spawnTimer <= 0){
      spawnRock();
      spawnTimer = Math.max(0.18, 0.55 - score / 5000);
    }

    alienTimer -= dt;
    if (alienTimer <= 0 && !boss){
      spawnAlien(false);
      alienTimer = Math.max(1.4, 5 - wave * 0.5);
    }

    if (!boss && score >= nextBossAt) spawnBoss();
  }

  ship.hurtFlash = Math.max(0, ship.hurtFlash - dt);
  ship.regenFlash = Math.max(0, ship.regenFlash - dt);
  muzzle = Math.max(0, muzzle - dt);
  shake = Math.max(0, shake - 40 * dt);

  for (const b of bullets) b.x += b.vx * dt;
  bullets = bullets.filter(b => b.x < W + 60);

  for (const b of ebullets){ b.x += b.vx * dt; b.y += b.vy * dt; }
  ebullets = ebullets.filter(b => b.x > -20 && b.y > -20 && b.y < H + 20);

  for (const r of rocks){
    r.x += r.vx * dt; r.y += r.vy * dt; r.rot += r.spin * dt;
    if (r.y < r.size) r.vy = Math.abs(r.vy);
    if (r.y > H - r.size) r.vy = -Math.abs(r.vy);
  }
  rocks = rocks.filter(r => r.x > -r.size - 40);

  for (const a of aliens){
    a.x += a.vx * dt;
    a.wob += dt;
    a.flash = Math.max(0, a.flash - dt * 8);
    a.gun -= dt;
    if (a.gun <= 0 && alive && a.x > ship.x){
      const aim = Math.atan2(ship.y - a.y, ship.x - a.x);
      ebullets.push({ x: a.x - 20, y: a.y, vx: Math.cos(aim) * 340, vy: Math.sin(aim) * 340 });
      a.gun = 1.6 + Math.random() * 1.6 - Math.min(0.8, wave * 0.08);
      sfx.alien();
    }
  }
  aliens = aliens.filter(a => a.x > -60);

  if (boss){
    boss.flash = Math.max(0, boss.flash - dt * 8);
    if (boss.entering){
      boss.x -= 120 * dt;
      if (boss.x <= W - 170) boss.entering = false;
    } else {
      boss.y += boss.vy * dt;
      if (boss.y < 110 || boss.y > H - 110) boss.vy *= -1;
      boss.gun -= dt;
      if (boss.gun <= 0 && alive){
        for (let s = -1; s <= 1; s++){
          const aim = Math.atan2(ship.y - boss.y, ship.x - boss.x) + s * 0.22;
          ebullets.push({ x: boss.x - 90, y: boss.y + 10, vx: Math.cos(aim)*300, vy: Math.sin(aim)*300 });
        }
        boss.gun = Math.max(1.1, 2.2 - wave * 0.12);
        sfx.alien();
      }
      boss.deploy -= dt;
      if (boss.deploy <= 0){
        spawnAlien(true);
        boss.deploy = Math.max(2.2, 4 - wave * 0.25);
      }
    }
  }

  for (const b of bullets){
    for (const r of rocks){
      const dx = b.x - r.x, dy = b.y - r.y;
      if (dx*dx + dy*dy < r.size * r.size){
        b.dead = true; r.hp -= 1;
        boom(b.x, b.y, 6, '#7FE3FF');
        if (r.hp <= 0){
          r.dead = true;
          score += Math.round(r.size);
          bigBoom(r.x, r.y, .7);
          sfx.boom();
        }
        break;
      }
    }
    if (b.dead) continue;
    for (const a of aliens){
      const dx = b.x - a.x, dy = b.y - a.y;
      if (dx*dx + dy*dy < 26*26){
        b.dead = true; a.hp -= 1; a.flash = 1;
        boom(b.x, b.y, 6, '#9B7BFF');
        if (a.hp <= 0){
          a.dead = true; score += 60;
          bigBoom(a.x, a.y, .9);
          sfx.boom(); shake = Math.min(14, shake + 3);
        }
        break;
      }
    }
    if (b.dead || !boss) continue;
    const dx = b.x - boss.x, dy = b.y - boss.y;
    if ((dx*dx)/(115*115) + (dy*dy)/(45*45) < 1){
      b.dead = true; boss.hp -= 1; boss.flash = 1;
      boom(b.x, b.y, 8, '#FF9CB0');
      if (boss.hp <= 0){
        score += 500; wave += 1; nextBossAt = score + 900 + wave * 250;
        bigBoom(boss.x, boss.y, 2.4);
        sfx.boom(); sfx.boss(); shake = 20;
        boss = null;
        document.getElementById('bossbar').classList.remove('on');
      }
    }
  }
  bullets = bullets.filter(b => !b.dead);
  rocks   = rocks.filter(r => !r.dead);
  aliens  = aliens.filter(a => !a.dead);

  if (alive){
    for (const b of ebullets){
      const dx = ship.x - b.x, dy = ship.y - b.y;
      if (dx*dx + dy*dy < 26*26){
        b.dead = true;
        boom(b.x, b.y, 8, '#FF5C7A');
        damage(5);
      }
    }
    ebullets = ebullets.filter(b => !b.dead);

    for (const r of rocks){
      const dx = ship.x - r.x, dy = ship.y - r.y;
      const reach = r.size + 24;
      if (dx*dx + dy*dy < reach * reach){
        r.dead = true;
        boom(r.x, r.y, 16, '#FF7452');
        damage(5);
      }
    }
    rocks = rocks.filter(r => !r.dead);

    for (const a of aliens){
      const dx = ship.x - a.x, dy = ship.y - a.y;
      if (dx*dx + dy*dy < 44*44){
        a.dead = true;
        boom(a.x, a.y, 16, '#9B7BFF');
        damage(5);
      }
    }
    aliens = aliens.filter(a => !a.dead);
  }

  for (const p of bits){ p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= (1-dt*1.4); p.vy *= (1-dt*1.4); p.life -= dt; }
  bits = bits.filter(p => p.life > 0);
  for (const r of rings){ r.r += (r.max - r.r) * 7 * dt; r.life -= dt * 2.2; }
  rings = rings.filter(r => r.life > 0);
  for (const p of trail){ p.x -= 240*dt; p.life -= dt * 1.6; }
  trail = trail.filter(p => p.life > 0);

  // ================= DRAW =================
  g.save();
  if (shake > 0) g.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);

  // deep space
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#070b26'); sky.addColorStop(0.55, '#040718'); sky.addColorStop(1, '#02030c');
  g.fillStyle = sky; g.fillRect(-24, -24, W+48, H+48);

  // nebulae FIRST — big, saturated, the Gradius sky. Drawn behind the planet.
  g.save(); g.globalCompositeOperation = 'lighter';
  for (const n of nebulae){
    if (alive) n.x -= n.speed * dt;
    if (n.x < -n.r) n.x = W + n.r;
    const R = n.r*1.4;
    const grad = g.createRadialGradient(n.x, n.y*H, 0, n.x, n.y*H, R);
    grad.addColorStop(0, 'hsla(' + n.hue + ',85%,50%,' + (n.a*3.2) + ')');
    grad.addColorStop(.55, 'hsla(' + (n.hue+30) + ',80%,40%,' + (n.a*1.8) + ')');
    grad.addColorStop(1, 'hsla(' + n.hue + ',70%,50%,0)');
    g.fillStyle = grad;
    g.fillRect(n.x - R, n.y*H - R, R*2, R*2);
  }
  g.restore();

  // THE CLONED EARTH — hangs in the upper distance, dark and waiting.
  const ex = W*0.8 - (score % 6000)*0.008, ey = H*0.26 + Math.sin(t*0.05)*5;
  g.drawImage(EARTH, ex - EARTH.width/2, ey - EARTH.height/2);

  // dust streaks
  g.strokeStyle = 'rgba(160,190,255,.14)'; g.lineWidth = 1;
  for (const d of dust){
    if (alive) d.x -= d.sp * dt;
    if (d.x < -d.len) d.x = W + d.len;
    g.beginPath(); g.moveTo(d.x, d.y*H); g.lineTo(d.x + d.len, d.y*H); g.stroke();
  }

  // stars
  for (const s of stars){
    if (alive) s.x -= s.speed * dt;
    if (s.x < -10) s.x = W + 10;
    g.globalAlpha = s.glow * (0.6 + 0.4 * Math.sin(t * 2 + s.y * 40));
    g.fillStyle = s.hue || '#EAF1FF';
    g.fillRect(s.x, s.y * H, s.size * (1 + s.speed / 200), s.size);
  }
  g.globalAlpha = 1;

  // engine trail (behind everything moving)
  g.save(); g.globalCompositeOperation = 'lighter';
  for (const p of trail){
    const tg = g.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.sz*2.4);
    tg.addColorStop(0, 'rgba(127,227,255,' + p.life*0.7 + ')');
    tg.addColorStop(1, 'rgba(127,227,255,0)');
    g.fillStyle = tg; g.beginPath(); g.arc(p.x, p.y, p.sz*2.4, 0, 6.28); g.fill();
  }
  g.restore();

  // asteroids — now lit from the beam side
  for (const r of rocks){
    g.save(); g.translate(r.x, r.y); g.rotate(r.rot);
    g.beginPath();
    r.pts.forEach((p, i) => {
      const px = Math.cos(p.a) * p.r, py = Math.sin(p.a) * p.r;
      i ? g.lineTo(px, py) : g.moveTo(px, py);
    });
    g.closePath();
    const rockG = g.createLinearGradient(-r.size, -r.size, r.size, r.size);
    rockG.addColorStop(0, '#7d84a4'); rockG.addColorStop(.5, '#565b74'); rockG.addColorStop(1, '#33374c');
    g.fillStyle = rockG; g.fill();
    g.strokeStyle = '#8c93b0'; g.lineWidth = 2; g.stroke();
    g.fillStyle = 'rgba(255,255,255,.10)';
    g.beginPath(); g.arc(-r.size*0.22, -r.size*0.18, r.size*0.24, 0, 6.28); g.fill();
    g.restore();
  }

  // OUR BEAMS — white core, cyan bloom, the Gradius look
  g.save(); g.globalCompositeOperation = 'lighter';
  for (const b of bullets){
    const grad = g.createLinearGradient(b.x - 46, 0, b.x + 8, 0);
    grad.addColorStop(0, 'rgba(127,227,255,0)');
    grad.addColorStop(.7, 'rgba(127,227,255,.55)');
    grad.addColorStop(1, 'rgba(127,227,255,.9)');
    g.fillStyle = grad;
    g.fillRect(b.x - 46, b.y - 4.5, 56, 9);
    g.fillStyle = 'rgba(255,255,255,.95)';
    g.fillRect(b.x - 34, b.y - 1.6, 44, 3.2);
  }
  // THEIR bolts — hot plasma orbs with halos
  for (const b of ebullets){
    const eg = g.createRadialGradient(b.x, b.y, 0, b.x, b.y, 11);
    eg.addColorStop(0, 'rgba(255,255,255,.95)');
    eg.addColorStop(.35, 'rgba(111,227,165,.85)');
    eg.addColorStop(1, 'rgba(111,227,165,0)');
    g.fillStyle = eg; g.beginPath(); g.arc(b.x, b.y, 11, 0, 6.28); g.fill();
  }
  g.restore();

  for (const a of aliens) drawAlien(a, t);
  if (boss) drawBoss(t);

  // explosion particles + shockwave rings (additive = they BLOOM)
  g.save(); g.globalCompositeOperation = 'lighter';
  for (const p of bits){
    g.globalAlpha = Math.max(0, p.life * 1.5);
    g.fillStyle = p.color;
    g.fillRect(p.x, p.y, p.sz, p.sz);
  }
  g.globalAlpha = 1;
  for (const r of rings){
    g.strokeStyle = 'rgba(255,220,150,' + r.life*0.8 + ')';
    g.lineWidth = 3 + r.life*3;
    g.beginPath(); g.arc(r.x, r.y, r.r, 0, 6.28); g.stroke();
  }
  g.restore();

  if (alive) drawShip(t);
  g.restore();

  document.getElementById('shieldFill').style.width = ship.shield + '%';
  document.getElementById('hullFill').style.width   = ship.hull + '%';
  document.getElementById('shieldNum').textContent  = Math.round(ship.shield);
  document.getElementById('hullNum').textContent    = Math.round(ship.hull);
  document.getElementById('scoreNum').textContent   = score;
  document.getElementById('wave').textContent       = 'WAVE ' + wave;
  document.getElementById('shieldBar').classList.toggle('regen', ship.regenFlash > 0);
  if (boss) document.getElementById('bossFill').style.width = (boss.hp / boss.maxHp * 100) + '%';

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// handy for poking at the game in the console (and for testing)
window.game = { ship, get rocks(){return rocks;}, get bullets(){return bullets;},
                get aliens(){return aliens;}, get boss(){return boss;},
                get score(){return score;}, set score(v){score=v;},
                damage, spawnRock, spawnAlien, spawnBoss, restart };
</script>
</body>
</html>
